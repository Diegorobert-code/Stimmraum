<title>Stimmraum</title>
<style>
/* Layout: App im Stil eines Musik-Players. Grosse Titel, Cover-Kacheln in waagrechten Regalen,
   gläserne Navigation. Jede Stufe hat ihr eigenes Farbcover (--c1/--c2). */
:root {
  --bg: #ffffff; --surface: #f4f4f7; --surface2: #e9e9ee; --ink: #111114; --muted: #6e6e76;
  --line: #e2e2e8; --line-strong: #c7c7cf; --accent: #fa2d55; --accent-ink: #ffffff; --accent-soft: #ffe3e9;
  --voice: #ff9f0a; --target: rgba(250,45,85,.18); --ghost: rgba(110,110,118,.14);
  --good: #1fae55; --good-soft: rgba(31,174,85,.22); --warn: #e08600; --warn-soft: rgba(255,159,10,.26); --bad: #e5322d; --bad-soft: rgba(229,50,45,.18);
  --glass: rgba(255,255,255,.78); --shadow: 0 10px 30px rgba(17,17,20,.12);
  --k-accent: #ff7a00; --k-soft: #fff0df; --k-target: rgba(255,122,0,.2);
  --f-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --f-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px; --r-sm: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #000000; --surface: #1c1c1e; --surface2: #2c2c2e; --ink: #f5f5f7; --muted: #98989f;
  --line: #2c2c2e; --line-strong: #48484a; --accent: #ff375f; --accent-ink: #ffffff; --accent-soft: #3a1520;
  --voice: #ffb340; --target: rgba(255,55,95,.24); --ghost: rgba(152,152,159,.16);
  --good: #32d74b; --good-soft: rgba(50,215,75,.25); --warn: #ffb340; --warn-soft: rgba(255,179,64,.25); --bad: #ff453a; --bad-soft: rgba(255,69,58,.24);
  --glass: rgba(22,22,24,.78); --shadow: 0 10px 30px rgba(0,0,0,.5);
  --k-accent: #ff9f0a; --k-soft: #3a2608; --k-target: rgba(255,159,10,.24); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --surface2: #2c2c2e; --ink: #f5f5f7; --muted: #98989f;
  --line: #2c2c2e; --line-strong: #48484a; --accent: #ff375f; --accent-ink: #ffffff; --accent-soft: #3a1520;
  --voice: #ffb340; --target: rgba(255,55,95,.24); --ghost: rgba(152,152,159,.16);
  --good: #32d74b; --good-soft: rgba(50,215,75,.25); --warn: #ffb340; --warn-soft: rgba(255,179,64,.25); --bad: #ff453a; --bad-soft: rgba(255,69,58,.24);
  --glass: rgba(22,22,24,.78); --shadow: 0 10px 30px rgba(0,0,0,.5);
  --k-accent: #ff9f0a; --k-soft: #3a2608; --k-target: rgba(255,159,10,.24); color-scheme: dark; }
body[data-mode="kids"] { --accent: var(--k-accent); --accent-soft: var(--k-soft); --target: var(--k-target); }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; letter-spacing: -0.01em; }
body.noscroll { overflow: hidden; }
#app { max-width: 760px; margin: 0 auto; padding-inline: 18px; padding-block: 18px calc(100px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 26px; }
h1, h2, h3, .h3 { font-family: var(--f-display); line-height: 1.1; margin: 0; text-wrap: balance; letter-spacing: -0.025em; }
h1 { font-size: clamp(2rem, 8vw, 2.6rem); font-weight: 800; }
h2 { font-size: 1.5rem; font-weight: 750; }
.h3 { font-size: 1.3rem; font-weight: 750; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
.eyebrow { font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 650; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.center { text-align: center; justify-content: center; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lead { font-size: 1.02rem; color: var(--muted); max-width: 60ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.card { background: var(--surface); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; }

/* Knöpfe */
.btn { font: 650 1rem var(--f-body); border: 0; border-radius: 999px; padding: 11px 20px; background: var(--accent); color: var(--accent-ink); cursor: pointer; min-height: 44px; display: inline-flex; align-items: center; gap: 8px; transition: transform .12s ease, filter .12s ease; }
.btn:active { transform: scale(.97); }
.btn.big { padding: 14px 26px; font-size: 1.05rem; }
.btn.ghost { background: var(--surface2); color: var(--ink); }
.btn.soft { background: var(--accent-soft); color: var(--accent); }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .45; cursor: default; }
.btn.play span { display: grid; }
.btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.icon-btn { border: 0; background: var(--surface2); color: var(--ink); width: 36px; height: 36px; border-radius: 50%; font-size: .95rem; cursor: pointer; flex: none; }
.link-btn { border: 0; background: none; color: var(--accent); font: 600 1rem var(--f-body); cursor: pointer; padding: 4px 0; }

/* Segment-Umschalter */
.seg { display: inline-flex; background: var(--surface2); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; }
.seg.wrap { flex-wrap: wrap; }
.seg.three { display: flex; }
.seg.three button { flex: 1; }
.seg button { border: 0; background: transparent; color: var(--ink); font: 600 .9rem var(--f-body); padding: 7px 14px; border-radius: 8px; cursor: pointer; min-height: 34px; opacity: .7; }
.seg button[aria-selected="true"] { background: var(--bg); opacity: 1; box-shadow: 0 1px 4px rgba(0,0,0,.14); }

/* Kopf */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; padding-top: 6px; }
.top > div:first-child { display: grid; gap: 2px; min-width: 0; }

/* Cover */
.cover { position: relative; aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 12px; overflow: hidden; color: #fff; padding: 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px;
  background: radial-gradient(120% 90% at 0% 0%, color-mix(in srgb, var(--c1) 85%, #fff 15%), transparent 60%), linear-gradient(140deg, var(--c1), var(--c2)); box-shadow: 0 6px 18px color-mix(in srgb, var(--c2) 35%, transparent); }
.cover-k { font: 650 .66rem var(--f-body); text-transform: uppercase; letter-spacing: .08em; opacity: .85; position: relative; z-index: 1; }
.cover-t { font: 800 1.02rem/1.08 var(--f-display); letter-spacing: -0.02em; position: relative; z-index: 1; text-wrap: balance; text-shadow: 0 1px 8px rgba(0,0,0,.18); }
.cover-wave { position: absolute; left: -10%; right: -10%; top: 18%; width: 120%; height: 34%; }
.cover.big .cover-t { font-size: 1.5rem; }
.cover.mini { width: 52px; height: 52px; border-radius: 8px; padding: 0; box-shadow: none; flex: none; }
.cover.mini .cover-k, .cover.mini .cover-t { display: none; }

/* Hauptkarte */
.feature { display: grid; grid-template-columns: minmax(0, 200px) 1fr; gap: 18px; align-items: center; padding: 16px; border-radius: 20px; position: relative; overflow: hidden;
  background: linear-gradient(160deg, color-mix(in srgb, var(--c1) 22%, var(--surface)), var(--surface) 70%); }
.feature-body { display: grid; gap: 8px; min-width: 0; }
.feature .meta { color: var(--muted); font-size: .9rem; }
@media (max-width: 560px) { .feature { grid-template-columns: 1fr; } .feature .cover.big { max-width: 260px; } }

/* Regale */
.shelf { display: grid; gap: 12px; }
.shelf-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.shelf-head.col { display: grid; gap: 2px; }
.shelf-row { display: grid; grid-auto-flow: column; grid-auto-columns: 152px; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 8px; margin-inline: -18px; padding-inline: 18px; scrollbar-width: none; }
.shelf-row::-webkit-scrollbar { display: none; }
.tile { scroll-snap-align: start; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); cursor: pointer; display: grid; gap: 6px; align-content: start; font: inherit; }
.tile:active .cover { transform: scale(.97); }
.tile .cover { transition: transform .15s ease; }
.tile-t { font-weight: 600; font-size: .95rem; line-height: 1.25; }
.tile-m { font-size: .82rem; color: var(--muted); }
.tile.locked { cursor: default; }
.tile.locked .cover { filter: grayscale(.6); opacity: .5; box-shadow: none; }
.tile.locked .cover::after { content: "🔒"; position: absolute; top: 10px; right: 10px; font-size: .9rem; }

/* Kennzahlen */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--r); padding: 12px 14px; display: grid; min-width: 0; }
.stat strong { font: 800 1.35rem var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: .8rem; color: var(--muted); }
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quick-btn { text-align: left; border: 0; color: #fff; border-radius: var(--r); padding: 16px 14px; display: grid; gap: 2px; cursor: pointer; font: inherit; min-width: 0; min-height: 84px; align-content: end;
  background: linear-gradient(135deg, var(--c1), var(--c2)); }
.quick-btn strong { font: 750 1.05rem var(--f-display); }
.quick-btn span { font-size: .84rem; opacity: .88; }
.tip { background: var(--surface); border-radius: var(--r); padding: 16px; display: grid; gap: 4px; }
.stars { letter-spacing: 1px; color: var(--line-strong); }
.stars .on { color: var(--voice); }
.big-stars { font-size: 2.6rem; }

/* Werkzeuge */
.page-head { display: grid; gap: 14px; }
.tool-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tool-card { text-align: left; border: 0; background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 14px; display: grid; gap: 2px; cursor: pointer; font: inherit; min-width: 0; }
.tool-card strong { font: 700 1.02rem var(--f-display); }
.tool-card span { font-size: .84rem; color: var(--muted); line-height: 1.35; }
.tool-card.active { box-shadow: inset 0 0 0 2px var(--accent); }
.tool-area:empty { display: none; }

/* Player */
.player { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px);
  background: radial-gradient(90% 50% at 50% 0%, color-mix(in srgb, var(--c1) 30%, transparent), transparent), radial-gradient(70% 40% at 100% 10%, color-mix(in srgb, var(--c2) 22%, transparent), transparent), var(--bg); }
.p-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; max-width: 760px; width: 100%; margin: 0 auto; }
.p-prog { flex: 1; display: flex; gap: 4px; }
.p-prog span { flex: 1; height: 4px; border-radius: 2px; background: var(--line-strong); opacity: .5; }
.p-prog span.done { background: var(--ink); opacity: .9; }
.p-prog span.cur { background: var(--accent); opacity: 1; }
.p-count { font: 500 .8rem var(--f-mono); color: var(--muted); }
.p-scroll { flex: 1; overflow-y: auto; max-width: 720px; width: 100%; margin: 0 auto; padding-inline: 18px; padding-block: 6px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.now { display: flex; gap: 12px; align-items: center; }
.now > div { min-width: 0; }
.now-t { font-weight: 650; }
.p-body { display: grid; gap: 14px; }
.p-text { font-size: 1.05rem; max-width: 62ch; }
.bullets { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.ex-title { font: 500 .85rem var(--f-mono); color: var(--muted); }
.roll-wrap { position: relative; }
.roll { width: 100%; max-width: 100%; height: 220px; display: block; background: var(--surface); border-radius: 16px; }
.roll.small { height: 140px; }
.live-note { position: absolute; top: 10px; right: 14px; text-align: right; display: grid; pointer-events: none; }
.ln-note { font: 800 1.7rem var(--f-display); font-variant-numeric: tabular-nums; }
.ln-dev { font-size: .82rem; color: var(--muted); }
.live-note[data-state="ok"] .ln-note { color: var(--good); }
.live-note[data-state="off"] .ln-note { color: var(--voice); }
.status:empty { display: none; }
.status { color: var(--muted); }
.notice { display: block; background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 10px 14px; font-size: .93rem; }
.timer { font: 800 3.2rem var(--f-display); font-variant-numeric: tabular-nums; text-align: center; letter-spacing: -0.03em; }
.links ul, .res-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }

/* Rückmeldung */
.feedback { display: grid; gap: 12px; background: var(--surface); border-radius: 18px; padding: 16px; }
.feedback:empty { display: none; }
.fb-head { display: flex; gap: 16px; align-items: center; }
.fb-sum { font-size: 1.1rem; font-weight: 700; }
.ring { position: relative; width: 80px; height: 80px; flex: none; display: grid; place-items: center; }
.ring > div { position: absolute; inset: 0; }
.ring strong { font: 800 1.5rem var(--f-display); line-height: 1; margin-top: -8px; }
.ring span { position: absolute; bottom: 18px; font-size: .6rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .8rem var(--f-mono); padding: 4px 9px; border-radius: 999px; display: inline-flex; gap: 6px; }
.chip.ok { background: var(--good-soft); }
.chip.off { background: var(--warn-soft); }
.chip.miss { background: var(--bad-soft); }
.tips { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.ai { display: grid; gap: 10px; justify-items: start; }
.ai-out { white-space: pre-wrap; background: var(--bg); border-radius: var(--r-sm); padding: 12px 14px; max-width: 62ch; }
.ai-out:empty { display: none; }

/* Atem */
.breath { position: relative; width: min(260px, 70vw); aspect-ratio: 1; max-width: 100%; margin: 6px auto; display: grid; place-items: center; }
.breath-ball { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--accent) 40%, #fff), var(--accent)); transform: scale(.45); transition: transform 4s ease-in-out; box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 45%, transparent); }
.breath-label { position: relative; font: 750 1.3rem var(--f-display); color: var(--ink); background: var(--glass); padding: 2px 14px; border-radius: 999px; backdrop-filter: blur(10px); }
.breath-sec { position: absolute; bottom: 18%; font: 500 1rem var(--f-mono); color: #fff; }

/* Stimmgerät und Klavier */
.tuner-note { font: 800 4.4rem var(--f-display); text-align: center; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -0.04em; }
.meter { position: relative; height: 46px; border-radius: 12px; background: linear-gradient(90deg, var(--bad-soft), var(--warn-soft) 30%, var(--good-soft) 45%, var(--good-soft) 55%, var(--warn-soft) 70%, var(--bad-soft)); }
.meter-scale { display: flex; justify-content: space-between; padding: 0 8px; font: 500 .72rem var(--f-mono); color: var(--muted); position: absolute; inset: auto 0 2px 0; }
.meter-needle { position: absolute; top: 4px; bottom: 18px; left: 50%; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--ink); transition: left .08s linear; }
.piano-wrap { overflow-x: auto; padding-bottom: 6px; }
.piano { display: flex; position: relative; height: 150px; min-width: 520px; }
.piano .w { flex: 1; border: 1px solid #c7c7cf; background: #fdfdfd; border-radius: 0 0 6px 6px; position: relative; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; touch-action: manipulation; }
.piano .w span { font: 500 .6rem var(--f-mono); color: #6e6e76; }
.piano .b { width: 0; position: relative; z-index: 2; border: 0; padding: 0; background: none; touch-action: manipulation; }
.piano .b::before { content: ""; position: absolute; left: -11px; width: 22px; height: 92px; background: #1c1c1e; border-radius: 0 0 4px 4px; }
.piano .w.down { background: var(--accent-soft); }
.piano .b.down::before { background: var(--accent); }

/* Formulare */
.select, .input { font: inherit; color: var(--ink); background: var(--surface2); border: 0; border-radius: var(--r-sm); padding: 10px 12px; min-height: 44px; max-width: 100%; }
textarea.input { width: 100%; resize: vertical; }
.lbl { font-weight: 650; font-size: .9rem; }
.form { gap: 10px; }
.switch { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.switch input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.confirm { background: var(--bad-soft); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 10px; }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.res { display: grid; gap: 10px; }
.res-list li { display: grid; background: var(--surface); border-radius: var(--r); padding: 12px 14px; }
.res-list a { font-weight: 650; }
.res-list span { font-size: .88rem; color: var(--muted); }

/* Aria (KI) */
.ai-av { width: 34px; height: 34px; flex: none; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 1rem; background: conic-gradient(from 200deg, #ff375f, #bf5af2, #5e5ce6, #64d2ff, #ff9f0a, #ff375f); box-shadow: 0 4px 14px rgba(191,90,242,.35); }
.ai-av.big { width: 48px; height: 48px; font-size: 1.35rem; }
.aria-card { border-radius: 20px; padding: 18px; display: grid; gap: 12px; position: relative; overflow: hidden;
  background: radial-gradient(120% 120% at 100% 0%, rgba(191,90,242,.20), transparent 55%), radial-gradient(100% 100% at 0% 100%, rgba(255,55,95,.16), transparent 55%), var(--surface); }
.aria-head { display: flex; gap: 12px; align-items: center; }
.aria-card .ai-out, .ask .ai-out { background: var(--bg); }
.ai-out.plan { line-height: 1.55; }
.step-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.spk { display: inline-grid; place-items: center; }
.spk.on, .mic.on { background: var(--accent); color: var(--accent-ink); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 25%, transparent); } }
.chat { display: grid; gap: 14px; }
.msg { display: flex; gap: 10px; align-items: flex-start; max-width: 100%; }
.msg p { white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me { justify-content: flex-end; }
.msg.me p { background: var(--accent); color: var(--accent-ink); padding: 10px 14px; border-radius: 20px 20px 6px 20px; max-width: 82%; }
.msg-c { display: grid; gap: 8px; background: var(--surface); padding: 12px 14px; border-radius: 6px 20px 20px 20px; min-width: 0; max-width: calc(100% - 44px); }
.msg-tools { display: flex; gap: 8px; }
.msg-tools:empty { display: none; }
.typing:empty, .typing[hidden] { display: none; }
.lesson-card { display: flex; gap: 12px; align-items: center; background: var(--bg); border-radius: 14px; padding: 10px; flex-wrap: wrap; }
.lc-body { display: grid; flex: 1; min-width: 120px; }
.sugg { display: flex; gap: 8px; overflow-x: auto; margin-inline: -18px; padding-inline: 18px; scrollbar-width: none; }
.sugg::-webkit-scrollbar { display: none; }
.chip-btn { flex: none; border: 1px solid var(--line-strong); background: var(--bg); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: 500 .9rem var(--f-body); cursor: pointer; }
.composer { position: sticky; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; align-items: flex-end; background: var(--glass); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-radius: 26px; padding: 6px; border: 0.5px solid var(--line-strong); z-index: 5; }
.composer .input { flex: 1; min-height: 40px; border-radius: 20px; padding: 9px 14px; resize: none; background: transparent; line-height: 1.35; }
.composer .icon-btn { width: 40px; height: 40px; display: grid; place-items: center; }
.composer .send { width: 40px; min-height: 40px; height: 40px; padding: 0; justify-content: center; font-size: 1.2rem; }
.composer.off { display: none; }
.setup:empty { display: none; }
.take { display: grid; gap: 6px; }
.take audio { width: 100%; max-width: 100%; }
.spark { width: 100%; height: 96px; display: block; }
.progress { gap: 8px; }
.mine-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; }
.mine { display: grid; gap: 2px; justify-items: start; }
.ai-setup ol { font-size: .95rem; }

/* Navigation */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--line-strong); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { display: grid; grid-template-columns: repeat(6, 1fr); max-width: 760px; width: 100%; }
