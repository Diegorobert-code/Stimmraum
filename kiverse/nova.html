<style>
:root {
  --nacht: #070e24; --nacht2: #0d1a3d; --tief: #050a1a;
  --gold: #f3c969; --gold2: #ffe4a3; --glas: rgba(255,255,255,.06); --glas2: rgba(255,255,255,.1);
  --linie: rgba(255,255,255,.12); --text: #eef2ff; --leise: #a9b4d6; --rot: #e0566a; --gruen: #6fdc9a;
  --sicher-oben: env(safe-area-inset-top, 0px); --sicher-unten: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--tief); color: var(--text); }
body { font: 16px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; overflow: hidden; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden;
  background: radial-gradient(120% 70% at 50% 0%, #1b2f6b 0%, var(--nacht2) 38%, var(--nacht) 70%, var(--tief) 100%); }
.sterne { position: absolute; inset: 0; pointer-events: none; opacity: .55;
  background-image: radial-gradient(1px 1px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 78% 12%, #fff, transparent),
  radial-gradient(1.5px 1.5px at 62% 30%, #ffe9b8, transparent), radial-gradient(1px 1px at 30% 8%, #fff, transparent),
  radial-gradient(1px 1px at 88% 34%, #fff, transparent), radial-gradient(1px 1px at 8% 40%, #cfe0ff, transparent),
  radial-gradient(1.5px 1.5px at 45% 16%, #fff, transparent); }

/* Kopf */
.kopf { position: relative; z-index: 2; display: flex; align-items: center; gap: 8px; padding: calc(var(--sicher-oben) + 8px) 16px 4px; }
.kopf h1 { margin: 0; flex: 1; text-align: center; font-size: 17px; font-weight: 600; letter-spacing: .02em; }
.rund { width: 40px; height: 40px; border-radius: 20px; border: 1px solid var(--linie); background: var(--glas); display: grid; place-items: center; font-size: 18px; }
.rund:active { transform: scale(.94); }
.zurueck { min-width: 40px; color: var(--leise); text-decoration: none; font-size: 15px; display: flex; align-items: center; height: 40px; }
.netz { position: relative; z-index: 2; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; padding: 2px 16px 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; background: var(--glas); border: 1px solid var(--linie); font-size: 12.5px; color: var(--leise); }
.punkt { width: 7px; height: 7px; border-radius: 50%; background: #56607e; }
.punkt.an { background: var(--gruen); box-shadow: 0 0 8px var(--gruen); }

/* Bühne mit Nova */
.inhalt { position: relative; min-height: 0; display: flex; flex-direction: column; }
.buehne { flex: none; display: flex; flex-direction: column; align-items: center; padding-top: 4px; transition: height .5s ease; height: 300px; }
.inhalt.klein .buehne { height: 168px; }
#nova { width: 210px; height: 236px; transition: width .5s ease, height .5s ease; cursor: pointer; touch-action: manipulation; overflow: visible; }
.inhalt.klein #nova { width: 118px; height: 132px; }
.zustand { margin-top: 2px; min-height: 22px; font-size: 14px; color: var(--leise); text-align: center; padding: 0 24px; }
.live { min-height: 0; max-width: 560px; margin: 2px 24px 0; text-align: center; font-size: 17px; color: var(--gold2); }

/* Verlauf */
.feed { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 16px 18px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
  mask-image: linear-gradient(to bottom, transparent 0, #000 18px, #000 calc(100% - 10px), transparent 100%); }
.zug { max-width: 640px; margin: 0 auto 14px; display: flex; flex-direction: column; gap: 8px; animation: rein .35s ease both; }
@keyframes rein { from { opacity: 0; transform: translateY(8px); } }
.blase { padding: 10px 14px; border-radius: 20px; max-width: 86%; white-space: pre-wrap; word-wrap: break-word; }
.du { align-self: flex-end; background: linear-gradient(180deg, #f6d27c, #e9b84f); color: #2a1d00; border-bottom-right-radius: 6px; }
.nv { align-self: flex-start; background: var(--glas2); border: 1px solid var(--linie); border-bottom-left-radius: 6px; }
.nv b.wer, .karte .wer { display: block; font-size: 12px; color: var(--gold); font-weight: 600; margin-bottom: 2px; letter-spacing: .03em; }
.fazit { border-color: rgba(243,201,105,.45); box-shadow: 0 0 0 1px rgba(243,201,105,.15) inset; }
.karte { align-self: stretch; margin-left: 10px; padding: 10px 12px; border-radius: 16px; background: rgba(0,0,0,.22); border: 1px solid var(--linie); font-size: 15px; }
.karte .kopfzeile { display: flex; align-items: center; gap: 8px; }
.ava { width: 28px; height: 28px; border-radius: 14px; display: grid; place-items: center; font-size: 15px; flex: none; background: #22305a; }
.karte .text { white-space: pre-wrap; margin-top: 6px; color: #dfe5fb; max-height: 9.5em; overflow: hidden; position: relative; }
.karte.offen .text { max-height: none; }
.karte .mehr, .karte .hoeren { margin-top: 6px; background: none; border: 0; color: var(--gold); font-size: 13.5px; padding: 4px 0; margin-right: 14px; }
.karte img { width: 100%; max-width: 420px; border-radius: 12px; display: block; margin-top: 8px; }
.karte.klein { font-size: 14px; color: var(--leise); padding: 8px 12px; }
a.oeffnen { display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: var(--text); font-weight: 600; }
a.oeffnen span:last-child { color: var(--gold); font-size: 20px; }
.warte { align-self: flex-start; margin-left: 10px; font-size: 13.5px; color: var(--leise); display: flex; gap: 8px; align-items: center; }
.warte i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); animation: hop 1.2s infinite ease-in-out; }
.warte i:nth-child(2) { animation-delay: .15s; } .warte i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%, 80%, 100% { opacity: .25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-4px); } }
.zeit { text-align: center; font-size: 12px; color: #6f7aa0; margin: 6px 0 12px; }

/* Unten */
.unten { position: relative; z-index: 3; padding: 6px 12px calc(var(--sicher-unten) + 10px); background: linear-gradient(to top, rgba(5,10,26,.96) 60%, rgba(5,10,26,0)); }
.vorschlaege { display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 10px; scrollbar-width: none; }
.vorschlaege::-webkit-scrollbar { display: none; }
.vorschlaege button { flex: none; padding: 8px 12px; border-radius: 99px; background: var(--glas); border: 1px solid var(--linie); font-size: 14px; color: #dbe2fb; }
.zeile { display: flex; align-items: flex-end; gap: 10px; max-width: 680px; margin: 0 auto; }
.feld { flex: 1; min-width: 0; display: flex; align-items: flex-end; background: var(--glas2); border: 1px solid var(--linie); border-radius: 24px; padding: 4px 4px 4px 14px; min-height: 48px; }
.feld textarea { flex: 1; min-width: 0; resize: none; border: 0; background: none; outline: none; font-size: 16px; padding: 9px 0; max-height: 120px; line-height: 1.35; }
.feld textarea::placeholder { color: #8a95ba; }
.schicken { width: 38px; height: 38px; border-radius: 19px; border: 0; background: var(--gold); color: #2a1d00; font-weight: 700; font-size: 18px; margin: 1px; }
.schicken:disabled { opacity: .3; }
.mic { width: 64px; height: 64px; border-radius: 32px; border: 0; flex: none; position: relative;
  background: radial-gradient(circle at 35% 30%, #ffeab8, var(--gold) 55%, #c98f22); color: #2a1d00; font-size: 26px;
  box-shadow: 0 6px 24px rgba(243,201,105,.35), 0 0 0 6px rgba(243,201,105,.08); transition: transform .15s; }
.mic:active { transform: scale(.94); }
.mic.hoert { background: radial-gradient(circle at 35% 30%, #ffb3be, var(--rot) 60%, #a5283c); color: #fff; box-shadow: 0 0 0 0 rgba(224,86,106,.6); animation: puls 1.4s infinite; }
@keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(224,86,106,.55); } 70% { box-shadow: 0 0 0 18px rgba(224,86,106,0); } 100% { box-shadow: 0 0 0 0 rgba(224,86,106,0); } }
.mic svg { width: 28px; height: 28px; }
.frei { width: 48px; height: 48px; border-radius: 24px; border: 1px solid var(--linie); background: var(--glas); flex: none; font-size: 24px; line-height: 1; color: var(--leise); }
.frei[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); background: rgba(243,201,105,.12); }

/* Blatt (Netz, Gedächtnis, Seele) */
.decke { position: fixed; inset: 0; background: rgba(0,0,0,.45); opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10; }
.decke.an { opacity: 1; pointer-events: auto; }
.blatt { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-height: 86vh; display: flex; flex-direction: column;
  background: #0c1633; border-top: 1px solid var(--linie); border-radius: 22px 22px 0 0; transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  padding-bottom: var(--sicher-unten); box-shadow: 0 -20px 60px rgba(0,0,0,.5); }
.blatt.an { transform: none; }
.griff { width: 40px; height: 5px; border-radius: 3px; background: #3a4670; margin: 8px auto 4px; }
.reiter { display: flex; gap: 6px; padding: 6px 16px 10px; overflow-x: auto; scrollbar-width: none; }
.reiter::-webkit-scrollbar { display: none; }
.reiter button { flex: 1 0 auto; white-space: nowrap; padding: 9px 10px; border-radius: 12px; border: 1px solid var(--linie); background: var(--glas); font-size: 14px; color: var(--leise); }
.reiter button.an { background: rgba(243,201,105,.14); border-color: rgba(243,201,105,.5); color: var(--gold2); }
.blattinhalt { overflow-y: auto; padding: 0 16px 20px; }
.blattinhalt h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8794bd; margin: 16px 2px 8px; font-weight: 600; }
.raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.kachel { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 12px 6px; border-radius: 16px; background: var(--glas); border: 1px solid var(--linie); text-decoration: none; color: var(--text); font-size: 13px; text-align: center; }
.kachel .ava { width: 40px; height: 40px; border-radius: 12px; font-size: 20px; }
.liste { display: flex; flex-direction: column; gap: 8px; }
.eintrag { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 14px; background: var(--glas); border: 1px solid var(--linie); font-size: 15px; }
.eintrag span { flex: 1; }
.eintrag button { border: 0; background: none; color: #8794bd; font-size: 18px; padding: 0 2px; }
.knopfreihe { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.knopf { padding: 10px 14px; border-radius: 12px; border: 1px solid var(--linie); background: var(--glas2); font-size: 14.5px; }
.knopf.gold { background: var(--gold); color: #2a1d00; border: 0; font-weight: 600; }
.blattinhalt textarea, .blattinhalt input[type=text] { width: 100%; border-radius: 14px; border: 1px solid var(--linie); background: rgba(0,0,0,.25); padding: 12px; font-size: 16px; outline: none; }
.blattinhalt textarea { min-height: 220px; line-height: 1.45; }
.satz { display: block; width: 100%; text-align: left; padding: 10px 12px; margin-bottom: 8px; border-radius: 14px; background: var(--glas); border: 1px solid var(--linie); font-size: 15px; color: var(--text); }
.satz small { display: block; color: var(--leise); font-size: 13px; margin-top: 2px; }

  background: #1a2752; border: 1px solid var(--linie); padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: 90vw; }
.toast.an { transform: translate(-50%, 0); }
/* Fenster Ergebnisse */
.rund { position: relative; }
.badge { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--gold); color: #2a1d00; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.badge[hidden] { display: none; }
.fenster { position: fixed; inset: 0; z-index: 15; background: #0a1430; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .3s cubic-bezier(.2,.8,.2,1); }
.fenster.an { transform: none; }
.fkopf { display: flex; align-items: center; gap: 8px; padding: calc(var(--sicher-oben) + 8px) 16px 8px; border-bottom: 1px solid var(--linie); }

.doku h1, .doku h2, .doku h3 { font-size: 18px; margin: 18px 0 8px; color: var(--gold2); }

<script>
(() => {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const K = new URLSearchParams(location.search).get('k') || '';
  const mitK = (p) => p + (p.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(K);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  async function api(p, daten, roh) {
    const r = await fetch(mitK(p), daten === undefined ? {} : { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(daten) });
    if (roh) return r;
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.fehler || 'Fehler ' + r.status);
    return d;
  }
  $('#zurueck').href = '/?welt=1&k=' + encodeURIComponent(K);
  let stand = { verlauf: [], gedaechtnis: [], seele: '', netz: { apps: [], figuren: [], schleife: {} } };
  const AVA = { lumo: ['🦉', '#2b3f7d'], tinko: ['🛠️', '#1f5a6b'], coinmaker: ['🪙', '#5a4720'], mamaaffe: ['🦧', '#6b3d1f'], sparky: ['🦊', '#7a3a1a'], otti: ['🦔', '#4d3b2b'],
    fompa: ['🦁', '#6b5520'], kimo: ['🐨', '#4a4f5c'], jackie: ['👠', '#6b2a4d'], letti: ['🕊️', '#3d4f6b'], eulin: ['🦉', '#5a2433'], fia: ['🐦‍🔥', '#7a2a2a'],
    waefwaef: ['🐶', '#4d5566'], ava: ['🎬', '#4a2b6b'], minky: ['🐱', '#3b4a6b'], brix: ['🧱', '#6b3b2b'], kay: ['👓', '#334455'], mrping: ['📈', '#1f4d3b'] };
  const APP_AVA = { humanspark: '✨', fiasnest: '🐦‍🔥', mondschein: '🌙', otti: '🦔', jackie: '👠', kiki: '🐨', mamaaffe: '🦧', fompa: '🦁', transkript: '📝', foodflow: '🥗', tradeping: '📈' };
  const ava = (id, gross) => { const a = AVA[id] || ['✦', '#2b3f7d']; return `<span class="ava" style="background:${a[1]}">${a[0]}</span>`; };

  // ---------- Nova bewegt sich ----------
  const N = { zustand: 'ruhig', pegel: 0, blinzeln: 0, naechstesBlinzeln: performance.now() + 2500, winken: 0, sprichtSeit: 0 };
  const el = (id) => document.getElementById(id);
  const ganz = el('ganz'), kopf = el('kopf'), aura = el('aura'), strahlen = el('strahlen'), mund = el('mund'), armL = el('armL'), armR = el('armR'),
    augeL = el('augeL'), augeR = el('augeR'), glanzL = el('glanzL'), glanzR = el('glanzR'), schatten = el('schatten'), spitze = el('spitze');
  function figur(t) {
    const s = t / 1000, z = N.zustand;
    const hub = z === 'spricht' ? 3.5 : z === 'hoert' ? 2 : 2.8;
    const y = Math.sin(s * (z === 'denkt' ? 3.2 : 1.6)) * hub;
    const neig = z === 'hoert' ? Math.sin(s * 1.3) * 2 + 5 : z === 'denkt' ? Math.sin(s * 2.4) * 3 : Math.sin(s * .9) * 1.5;
    ganz.setAttribute('transform', `translate(0 ${y.toFixed(2)}) rotate(${(neig * .35).toFixed(2)} 100 160)`);
    kopf.setAttribute('transform', `rotate(${neig.toFixed(2)} 100 100)`);
    schatten.setAttribute('rx', (46 - y * 1.2).toFixed(1));
    // Licht
    const p = N.pegel;
    const glanz = z === 'spricht' ? .78 + p * .5 : z === 'hoert' ? .85 + Math.sin(s * 4) * .1 : z === 'denkt' ? .7 + Math.sin(s * 6) * .15 : .55 + Math.sin(s * 1.6) * .1;
    aura.setAttribute('opacity', Math.min(1, glanz).toFixed(3));
    aura.setAttribute('r', (74 + p * 22 + (z === 'hoert' ? 6 : 0)).toFixed(1));
    spitze.setAttribute('fill', z === 'hoert' ? '#ff8fa0' : '#f3c969');
    strahlen.setAttribute('opacity', z === 'denkt' ? '.85' : z === 'spricht' ? (.25 + p * .5).toFixed(2) : '0');
    strahlen.setAttribute('transform', `rotate(${z === 'denkt' ? (s * 70) % 360 : Math.sin(s) * 8} 100 70)`);
    // Augen: blinzeln, im Denken nach oben schauen
    if (t > N.naechstesBlinzeln) { N.blinzeln = t; N.naechstesBlinzeln = t + 2200 + Math.random() * 3200; }
    const b = t - N.blinzeln < 140 ? Math.max(.08, Math.abs(1 - (t - N.blinzeln) / 70)) : 1;
    const blick = z === 'denkt' ? -3 : z === 'hoert' ? 1 : 0, seit = z === 'denkt' ? Math.sin(s * 1.7) * 3 : 0;
    for (const [a, g, x] of [[augeL, glanzL, 84], [augeR, glanzR, 116]]) {
      a.setAttribute('ry', (7 * b).toFixed(2)); a.setAttribute('cy', 70 + blick); a.setAttribute('cx', x + seit);
      g.setAttribute('cy', 67 + blick); g.setAttribute('cx', x + 2 + seit); g.setAttribute('opacity', b > .5 ? 1 : 0);
    }
    // Mund: beim Sprechen nach Lautstärke
    const offen = z === 'spricht' ? Math.max(1.5, p * 14) : z === 'hoert' ? 2 : 0;
    mund.setAttribute('d', offen > 1 ? `M91 83 Q100 ${(83 + offen * .25).toFixed(1)} 109 83 Q100 ${(85 + offen).toFixed(1)} 91 83 Z` : 'M92 84 Q100 90 108 84');
    mund.setAttribute('stroke-width', offen > 1 ? 2 : 3);
    // Arme: winken bei Begrüssung, leicht schwingen sonst
    const w = t - N.winken < 1800 ? Math.sin((t - N.winken) / 90) * 28 - 40 : 0;
    armR.setAttribute('transform', `rotate(${(w || Math.sin(s * 1.6) * 4 - (z === 'spricht' ? 8 + p * 20 : 0)).toFixed(1)} 132 140)`);
    armL.setAttribute('transform', `rotate(${(Math.sin(s * 1.6 + 1) * -4 + (z === 'spricht' ? 6 + p * 14 : 0)).toFixed(1)} 68 140)`);
    if (z !== 'spricht') N.pegel *= .85;
    requestAnimationFrame(figur);
  }
  requestAnimationFrame(figur);
  const setze = (z, text) => { N.zustand = z; if (text != null) $('#zustand').textContent = text; };

  // ---------- Stimme ----------
  let actx = null, analyser = null, audioEl = null;
  function audioBereit() {
    if (!audioEl) { audioEl = new Audio(); audioEl.playsInline = true; audioEl.preload = 'auto'; }
    try {
      if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); analyser = actx.createAnalyser(); analyser.fftSize = 512;
        const q = actx.createMediaElementSource(audioEl); q.connect(analyser); analyser.connect(actx.destination); }
      if (actx.state === 'suspended') actx.resume();
    } catch {}
  }
  const puffer = new Uint8Array(512);
  function pegelMessen() {
    if (N.zustand !== 'spricht') return;
    if (analyser && audioEl && !audioEl.paused) { analyser.getByteTimeDomainData(puffer); let m = 0; for (const v of puffer) m = Math.max(m, Math.abs(v - 128)); N.pegel = N.pegel * .5 + Math.min(1, m / 60) * .5; }
    else N.pegel = .25 + Math.abs(Math.sin(performance.now() / 95)) * .45 * (Math.random() * .5 + .5);
    requestAnimationFrame(pegelMessen);
  }
  function besteGeraetestimme() {
    const v = speechSynthesis.getVoices().filter(x => /^de/i.test(x.lang));
    return v.find(x => /premium|enhanced|erweitert|siri/i.test(x.name)) || v.find(x => /de-CH/i.test(x.lang)) || v.find(x => /anna|petra|helena|marlene/i.test(x.name)) || v[0] || null;
  }
  let kette = Promise.resolve(), stumm = false;
  const sprechen = (text, figur = null) => (kette = kette.then(() => sprichJetzt(text, figur)).catch(() => {}));
  async function sprichJetzt(text, figur) {
    text = String(text || '').trim(); if (!text || stumm) return;
    setze('spricht', 'Nova spricht …'); requestAnimationFrame(pegelMessen);
    try {
      const r = await api(figur ? 'api/stimme' : 'api/zentrale/stimme', figur ? { figur, text: text.slice(0, 600) } : { text: text.slice(0, 600) }, true);
      if (r.status === 200) {
        const url = URL.createObjectURL(await r.blob());
        audioBereit();
        await new Promise((ok) => { audioEl.onended = audioEl.onerror = ok; audioEl.src = url; audioEl.play().catch(ok); });
        URL.revokeObjectURL(url);
        return;
      }
    } catch {}
    // Ersatz: beste deutsche Gerätestimme
    if ('speechSynthesis' in window) await new Promise((ok) => {
      const u = new SpeechSynthesisUtterance(text); const v = besteGeraetestimme(); if (v) u.voice = v; u.lang = v?.lang || 'de-CH'; u.rate = 1.03; u.pitch = 1.08;
      u.onend = u.onerror = ok; speechSynthesis.cancel(); speechSynthesis.speak(u); setTimeout(ok, 30000);
    });
  }
  const fertigGesprochen = () => kette.then(() => { if (N.zustand === 'spricht') setze('ruhig', 'Tipp auf mich und sprich.'); });

  // ---------- Zuhören ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let rec = null, hoert = false, frei = false, gesagt = '', sprache = 'de-CH';
  try { frei = localStorage.getItem('nova-frei') === '1'; } catch {}
  $('#frei').setAttribute('aria-pressed', frei);
  function zuhoeren() {
    if (!SR) { toast('Dieses Gerät kann hier nicht zuhören. Bitte tippen.'); $('#eingabe').focus(); return; }
    if (hoert) { rec?.stop(); return; }
    audioBereit(); speechSynthesis?.cancel?.(); if (audioEl && !audioEl.paused) audioEl.pause();
    gesagt = ''; rec = new SR(); rec.lang = sprache; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;

      if ((m = l.match(/^(#{1,3})\s+(.*)/))) { listeZu(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
      else if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(l)) { listeZu(); out.push('<hr>'); }
      else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (liste !== 'ul') { listeZu(); out.push('<ul>'); liste = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
      else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))) { if (liste !== 'ol') { listeZu(); out.push('<ol>'); liste = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
      else if ((m = l.match(/^\s*>\s?(.*)/))) { listeZu(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); }
      else if (!l.trim()) listeZu();
      else { listeZu(); out.push(`<p>${inline(l)}</p>`); }
      i++;
    }
    listeZu(); return out.join('');
  }
  const F = { offen: null, liste: [] };
  function ergBadge(n) { const b = $('#ergBadge'); b.hidden = !n; b.textContent = n > 9 ? '9+' : n || ''; }
  async function ergListe() {
    F.offen = null; $('#fTitel').textContent = '📂 Ergebnisse'; $('#fLeiste').hidden = true; $('#fZurueck').style.visibility = 'hidden';
    const h = $('#fInhalt'); h.innerHTML = '<p class="hinweis">Lädt …</p>';
    try {
      F.liste = (await api('api/zentrale/ergebnisse')).ergebnisse;
      ergBadge(F.liste.filter(e => e.neu).length);
      h.innerHTML = F.liste.length ? F.liste.map(e => `<button class="ekarte ${e.neu ? 'neu' : ''}" type="button" data-e="${esc(e.id)}"><b>${esc(e.titel)}</b><small>${esc(e.von)} · ${new Date(e.zeit).toLocaleString('de-CH', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</small><small>${esc(e.vorschau)}</small></button>`).join('')
        : '<p class="hinweis">Noch nichts da. Hier landen alle fertigen Ergebnisse, Briefe und Texte zum Kopieren, direkt in Nova, ohne fremde Links.</p>';
      h.querySelectorAll('[data-e]').forEach(b => b.onclick = () => ergZeigen(b.dataset.e));
    } catch (e) { h.innerHTML = `<p class="hinweis">${esc(e.message)}</p>`; }
  }
  async function ergZeigen(eid) {
    const h = $('#fInhalt'); h.innerHTML = '<p class="hinweis">Lädt …</p>'; $('#fZurueck').style.visibility = 'visible';
    try {
      const e = await api('api/zentrale/ergebnis?id=' + encodeURIComponent(eid)); F.offen = e;
      $('#fTitel').textContent = e.titel;
      const l = $('#fLeiste'); l.hidden = false;
      l.innerHTML = `<button class="knopf gold" type="button" id="fAlles">📋 Alles kopieren</button>${e.link ? `<a class="knopf" href="${esc(e.link)}" target="_blank" rel="noopener">↗︎ Öffnen</a>` : ''}${navigator.share ? '<button class="knopf" type="button" id="fTeilen">Teilen</button>' : ''}<button class="knopf" type="button" id="fWeg">🗑</button>`;
      h.innerHTML = `<p class="hinweis">${esc(e.von)} · ${new Date(e.zeit).toLocaleString('de-CH')}</p><div class="doku">${markdown(e.text)}</div>`;
      h.scrollTop = 0;
      h.querySelectorAll('[data-kopie]').forEach(b => b.onclick = () => kopieren(codeTeile[+b.dataset.kopie]));
      $('#fAlles').onclick = () => kopieren(e.text);
      if ($('#fTeilen')) $('#fTeilen').onclick = () => navigator.share({ title: e.titel, text: e.text }).catch(() => {});
      $('#fWeg').onclick = async () => { if (!confirm('Dieses Ergebnis löschen?')) return; await api('api/zentrale/ergebnis-weg', { id: e.id }).catch(x => toast(x.message)); ergListe(); };
      history.replaceState(null, '', '#e=' + e.id);
    } catch (x) { h.innerHTML = `<p class="hinweis">${esc(x.message)}</p>`; }
  }
  const fensterAuf = (eid) => { $('#fenster').classList.add('an'); eid ? ergZeigen(eid) : ergListe(); };
  const fensterZu = () => { $('#fenster').classList.remove('an'); history.replaceState(null, '', location.pathname + location.search); laden(false); };
  $('#ergKnopf').onclick = () => fensterAuf();
  $('#fZu').onclick = fensterZu;
  $('#fZurueck').onclick = () => ergListe();
  { const m = location.hash.match(/^#e=([a-z0-9_]+)/); if (m) fensterAuf(m[1]); }

  async function laden(alles = true) {
    try {
      stand = await api('api/zentrale');
      netzZeigen(); ergBadge(stand.ergebnisse?.neu || 0);
      if (alles) {
        feed.innerHTML = '';
        let tag = '';
        for (const z of stand.verlauf) {
          const t = new Date(z.zeit).toLocaleDateString('de-CH', { weekday: 'long', day: 'numeric', month: 'long' });
          if (t !== tag) { tag = t; const d = document.createElement('div'); d.className = 'zeit'; d.textContent = t; feed.appendChild(d); }
          zeigeZug(z, false);
          if (!z.fertig) abholen(z.id);
        }
        $('#inhalt').classList.toggle('klein', stand.verlauf.length > 0);
        feed.scrollTop = feed.scrollHeight;
        vorschlaegeZeigen();
        if (!stand.verlauf.length) { N.winken = performance.now() + 400; setze('ruhig', 'Hallo Diego. Tipp auf mich und sprich.'); }
      }
      if ($('#blatt').classList.contains('an')) blattZeigen();
    } catch (e) { setze('ruhig', e.message); }
  }
  laden();
  setInterval(() => { if (document.visibilityState === 'visible' && !sendet) api('api/zentrale').then(s => { stand = s; netzZeigen(); ergBadge(s.ergebnisse?.neu || 0); }).catch(() => {}); }, 30000);
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => {};
  // Begrüssung winkt beim Öffnen
  setTimeout(() => { N.winken = performance.now(); }, 600);
  // Push-Nachrichten (Diego 21.10.): einmal 🔔 tippen, dann meldet sich Nova, wenn etwas fertig ist
  (function push() {
    const k = $('#pushKnopf');
    const an = () => { k.style.opacity = '.45'; k.setAttribute('aria-label', 'Push ist an'); };
    if ('serviceWorker' in navigator && 'PushManager' in window && Notification.permission === 'granted') navigator.serviceWorker.getRegistration('/').then(r => r && r.pushManager.getSubscription()).then(s => { if (s) an(); }).catch(() => {});
    k.addEventListener('click', async () => {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return toast('Push geht nur aus dem Nova-Symbol auf dem Home-Bildschirm (Teilen → «Zum Home-Bildschirm»).');
      try {
        const reg = await navigator.serviceWorker.register('/nova-sw.js', { scope: '/' });
        if (await Notification.requestPermission() !== 'granted') return toast('Mitteilungen sind nicht erlaubt. Einstellungen → Mitteilungen → Nova.');
        const { schluessel } = await api('api/push/schluessel');
        const roh = atob(schluessel.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - schluessel.length % 4) % 4));
        const s = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: Uint8Array.from(roh, c => c.charCodeAt(0)) });
        const r = await api('api/push/abo', s.toJSON());
        an(); toast(r.text || 'Push ist an.');
      } catch (e) { toast('Push ging nicht: ' + e.message); }
    });
  })();
  // 🌱 Heute gewachsen (Diego 21.10.): was Nova heute dazugelernt hat
  $('#wuchsKnopf').addEventListener('click', async () => {
    const d = await api('api/zentrale/gewachsen').catch(e => { toast(e.message); return null; }); if (!d) return;
    const w = document.createElement('div'); w.className = 'wuchs';
    const esc2 = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    w.innerHTML = `<div class="karte"><h2>🌱 Heute gewachsen</h2><p>So viel hat Nova heute dazugelernt.</p>
      <div class="zahlen"><div><b>${d.wissen}</b>Wissen</div><div><b>${d.erlebnisse}</b>Erlebnisse</div></div>
      ${d.stichworte.length ? '<ul>' + d.stichworte.map(s => `<li>${esc2(s)}</li>`).join('') + '</ul>' : '<p>Heute noch nichts Neues. Erzähl Claude etwas, dann wächst sie.</p>'}
      ${d.figuren.length ? `<p>Erlebt mit: ${d.figuren.map(esc2).join(', ')}</p>` : ''}<button type="button">Schliessen</button></div>`;
    w.addEventListener('click', (e) => { if (e.target === w || e.target.tagName === 'BUTTON') w.remove(); });
    document.body.append(w);
  });
})();
</script>
</body>
