<title>Stimmraum</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: eine ruhige Lesespalte wie ein Übungsheft, Navigation unten wie eine App.
   Farbe: Salbei-Grund, tiefes Petrol als Akzent, Safran für die eigene Stimme. */
:root {
  --bg: #edf1ec; --surface: #fbfcfa; --surface2: #e2e9e3; --ink: #1c2725; --muted: #56655f;
  --line: #d3ddd6; --line-strong: #aebcb3; --accent: #1f6b64; --accent-ink: #ffffff; --accent-soft: #d3e6e2;
  --voice: #d48a22; --target: rgba(31,107,100,.20); --ghost: rgba(86,101,95,.14);
  --good: #2b8a55; --good-soft: rgba(43,138,85,.28); --warn: #c27a1c; --warn-soft: rgba(212,138,34,.30); --bad: #bf4338; --bad-soft: rgba(191,67,56,.22);
  --k-accent: #c9466c; --k-soft: #f6d9e1; --k-target: rgba(201,70,108,.20);
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 14px; --r-sm: 9px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111816; --surface: #19221f; --surface2: #222d2a; --ink: #e4ece9; --muted: #98a8a2;
  --line: #2c3834; --line-strong: #44544e; --accent: #5ebfb2; --accent-ink: #0d1a17; --accent-soft: #1f3a36;
  --voice: #f0b14e; --target: rgba(94,191,178,.22); --ghost: rgba(152,168,162,.14);
  --good: #5cc98a; --good-soft: rgba(92,201,138,.28); --warn: #e6a64b; --warn-soft: rgba(240,177,78,.28); --bad: #ef7a6f; --bad-soft: rgba(239,122,111,.24);
  --k-accent: #f08aa7; --k-soft: #3d2530; --k-target: rgba(240,138,167,.22); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #111816; --surface: #19221f; --surface2: #222d2a; --ink: #e4ece9; --muted: #98a8a2;
  --line: #2c3834; --line-strong: #44544e; --accent: #5ebfb2; --accent-ink: #0d1a17; --accent-soft: #1f3a36;
  --voice: #f0b14e; --target: rgba(94,191,178,.22); --ghost: rgba(152,168,162,.14);
  --good: #5cc98a; --good-soft: rgba(92,201,138,.28); --warn: #e6a64b; --warn-soft: rgba(240,177,78,.28); --bad: #ef7a6f; --bad-soft: rgba(239,122,111,.24);
  --k-accent: #f08aa7; --k-soft: #3d2530; --k-target: rgba(240,138,167,.22); color-scheme: dark; }
body[data-mode="kids"] { --accent: var(--k-accent); --accent-soft: var(--k-soft); --target: var(--k-target); --r: 22px; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
body.noscroll { overflow: hidden; }
#app { max-width: 720px; margin: 0 auto; padding-inline: 18px; padding-block: 20px calc(96px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 22px; }
h1, h2, h3, .h3 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.8rem, 6vw, 2.5rem); font-weight: 700; }
h2 { font-size: 1.45rem; font-weight: 700; }
.h3 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 3px; }
.eyebrow { font-size: .78rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.center { text-align: center; justify-content: center; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.lead { font-size: 1.08rem; color: var(--muted); max-width: 60ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; }

/* Knöpfe */
.btn { font: 700 1rem var(--f-body); border: 0; border-radius: 999px; padding: 11px 20px; background: var(--accent); color: var(--accent-ink); cursor: pointer; min-height: 44px; }
.btn.big { padding: 14px 26px; font-size: 1.05rem; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line-strong); }
.btn.soft { background: var(--accent-soft); color: var(--ink); }
.btn.danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:focus-visible, button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--voice); outline-offset: 2px; }
.icon-btn { border: 0; background: var(--surface2); color: var(--ink); width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; cursor: pointer; flex: none; }

/* Segment-Umschalter */
.seg { display: inline-flex; background: var(--surface2); border-radius: 999px; padding: 4px; gap: 2px; max-width: 100%; }
.seg.wrap { flex-wrap: wrap; border-radius: var(--r-sm); }
.seg button { border: 0; background: transparent; color: var(--muted); font: 700 .95rem var(--f-body); padding: 8px 16px; border-radius: 999px; cursor: pointer; min-height: 38px; }
.seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

/* Start */
.hero { display: grid; gap: 12px; justify-items: start; padding-top: 8px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; display: grid; min-width: 0; }
.stat strong { font: 700 1.35rem var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat span { font-size: .82rem; color: var(--muted); }
.next { background: var(--accent); color: var(--accent-ink); border: 0; }
.next .eyebrow, .next .meta { color: inherit; opacity: .8; }
.next .btn { background: var(--accent-ink); color: var(--accent); }
.quick { display: grid; gap: 10px; }
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quick-btn, .tool-card { text-align: left; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r-sm); padding: 14px; display: grid; gap: 2px; cursor: pointer; font: inherit; min-width: 0; }
.quick-btn strong, .tool-card strong { font-family: var(--f-display); font-size: 1.05rem; }
.quick-btn span, .tool-card span { font-size: .86rem; color: var(--muted); line-height: 1.35; }
.quick-btn:hover, .tool-card:hover { border-color: var(--accent); }
.tool-card.active { border-color: var(--accent); box-shadow: inset 0 0 0 1.5px var(--accent); }
.tip { border-left: 3px solid var(--voice); padding: 4px 0 4px 16px; display: grid; gap: 4px; }

/* Kurs */
.page-head { display: grid; gap: 14px; }
.seg.three button { padding: 8px 12px; }
.stage { display: grid; gap: 12px; }
.stage-head { display: flex; gap: 14px; align-items: flex-start; }
.stage-head > div { min-width: 0; display: grid; gap: 4px; }
.stage-no { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--accent-soft); color: var(--ink); font: 700 1rem var(--f-display); }
.lessons { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lesson-row { width: 100%; display: flex; gap: 12px; justify-content: space-between; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; font: inherit; color: var(--ink); }
.lesson-row:hover:not(:disabled) { border-color: var(--accent); }
.lesson-row.locked { opacity: .55; cursor: default; }
.l-title { display: grid; font-weight: 700; min-width: 0; }
.l-title small { font-weight: 400; color: var(--muted); font-size: .88rem; }
.l-meta { flex: none; font-size: .85rem; color: var(--muted); }
.stars { letter-spacing: 1px; color: var(--line-strong); }
.stars .on { color: var(--voice); }
.big-stars { font-size: 2.6rem; }

/* Player */
.player { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
.p-top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; max-width: 760px; width: 100%; margin: 0 auto; }
.p-prog { flex: 1; display: flex; gap: 4px; }
.p-prog span { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.p-prog span.done { background: var(--accent); }
.p-prog span.cur { background: var(--voice); }
.p-count { font: 500 .85rem var(--f-mono); color: var(--muted); }
.p-scroll { flex: 1; overflow-y: auto; max-width: 720px; width: 100%; margin: 0 auto; padding-inline: 18px; padding-block: 8px calc(32px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 14px; align-content: start; }
.p-body { display: grid; gap: 14px; }
.p-text { font-size: 1.08rem; max-width: 62ch; }
.bullets { margin: 0; padding-left: 1.2em; display: grid; gap: 6px; }
.ex-title { font: 500 .9rem var(--f-mono); color: var(--muted); }
.roll-wrap { position: relative; }
.roll { width: 100%; max-width: 100%; height: 220px; display: block; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.roll.small { height: 140px; }
.live-note { position: absolute; top: 10px; right: 12px; text-align: right; display: grid; pointer-events: none; }
.ln-note { font: 700 1.6rem var(--f-display); font-variant-numeric: tabular-nums; }
.ln-dev { font-size: .85rem; color: var(--muted); }
.live-note[data-state="ok"] .ln-note { color: var(--good); }
.live-note[data-state="off"] .ln-note { color: var(--voice); }
.status:empty { display: none; }
.status { color: var(--muted); }
.notice { display: block; background: var(--accent-soft); color: var(--ink); border-radius: var(--r-sm); padding: 10px 14px; font-size: .95rem; }
.timer { font: 700 3rem var(--f-display); font-variant-numeric: tabular-nums; text-align: center; }
.finish { text-align: left; }
.links ul, .res-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }

/* Rückmeldung */
.feedback { display: grid; gap: 12px; }
.feedback:empty { display: none; }
.fb-head { display: flex; gap: 16px; align-items: center; }
.fb-sum { font-size: 1.1rem; font-weight: 700; }
.ring { position: relative; width: 80px; height: 80px; flex: none; display: grid; place-items: center; }
.ring > div { position: absolute; inset: 0; }
.ring strong { font: 700 1.5rem var(--f-display); line-height: 1; margin-top: -8px; }
.ring span { position: absolute; bottom: 18px; font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 .82rem var(--f-mono); padding: 4px 9px; border-radius: 999px; display: inline-flex; gap: 6px; }
.chip.ok { background: var(--good-soft); }
.chip.off { background: var(--warn-soft); }
.chip.miss { background: var(--bad-soft); }
.tips { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.ai { display: grid; gap: 10px; justify-items: start; }
.ai-out { white-space: pre-wrap; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; max-width: 62ch; }
.ai-out:empty { display: none; }

/* Atem */
.breath { position: relative; width: min(260px, 70vw); aspect-ratio: 1; max-width: 100%; margin: 6px auto; display: grid; place-items: center; }
.breath-ball { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 40% 35%, var(--accent-soft), var(--accent)); transform: scale(.45); transition: transform 4s ease-in-out; opacity: .9; }
.breath-label { position: relative; font: 700 1.4rem var(--f-display); color: var(--ink); background: var(--surface); padding: 2px 12px; border-radius: 999px; }
.breath-sec { position: absolute; bottom: 18%; font: 500 1rem var(--f-mono); color: var(--ink); }

/* Werkzeuge */
.tool-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.tool-area:empty { display: none; }
.tuner-note { font: 700 4rem var(--f-display); text-align: center; line-height: 1; font-variant-numeric: tabular-nums; }
.meter { position: relative; height: 46px; border-radius: var(--r-sm); background: linear-gradient(90deg, var(--bad-soft), var(--warn-soft) 30%, var(--good-soft) 45%, var(--good-soft) 55%, var(--warn-soft) 70%, var(--bad-soft)); }
.meter-scale { display: flex; justify-content: space-between; padding: 0 8px; font: 500 .75rem var(--f-mono); color: var(--muted); position: absolute; inset: auto 0 2px 0; }
.meter-needle { position: absolute; top: 4px; bottom: 18px; left: 50%; width: 4px; margin-left: -2px; border-radius: 2px; background: var(--ink); transition: left .08s linear; }
.piano-wrap { overflow-x: auto; padding-bottom: 6px; }
.piano { display: flex; position: relative; height: 150px; min-width: 520px; }
.piano .w { flex: 1; border: 1px solid var(--line-strong); background: #fdfdfb; border-radius: 0 0 6px 6px; position: relative; cursor: pointer; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; touch-action: manipulation; }
.piano .w span { font: 500 .62rem var(--f-mono); color: #6b7a74; }
.piano .b { width: 0; position: relative; z-index: 2; border: 0; padding: 0; background: none; touch-action: manipulation; }
.piano .b::before { content: ""; position: absolute; left: -11px; width: 22px; height: 92px; background: #1d2522; border-radius: 0 0 4px 4px; }
.piano .w.down { background: var(--accent-soft); }
.piano .b.down::before { background: var(--accent); }
.select, .input { font: inherit; color: var(--ink); background: var(--surface); border: 1.5px solid var(--line-strong); border-radius: var(--r-sm); padding: 9px 12px; min-height: 44px; max-width: 100%; }
textarea.input { width: 100%; resize: vertical; }
.lbl { font-weight: 700; font-size: .92rem; }
.form { gap: 10px; }
.switch { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.switch input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--accent); flex: none; }
.confirm { background: var(--bad-soft); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 10px; }
.rules { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.res { display: grid; gap: 10px; }
.res-list li { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; }
.res-list a { font-weight: 700; }
.res-list span { font-size: .9rem; color: var(--muted); }
.done-card { border-color: var(--voice); }

/* Navigation */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar-in { display: grid; grid-template-columns: repeat(5, 1fr); max-width: 720px; width: 100%; }
.tabbar button { border: 0; background: none; color: var(--muted); font: 700 .74rem var(--f-body); padding: 8px 2px 10px; display: grid; justify-items: center; gap: 3px; cursor: pointer; min-height: 56px; }
.tabbar svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--accent); }

@media (max-width: 420px) {
  body { font-size: 16px; }
  .stats { gap: 6px; }
  .stat { padding: 10px; }
  .stat strong { font-size: 1.1rem; }
  .seg button { padding: 8px 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<script>
/* ==========================================================================
   Kursinhalte. Neue Lektionen einfach hier ergänzen: jede Lektion hat
   id, title, min (Minuten), goal und steps. Schritt-Typen:
   info · breath · hiss · sustain · match · glide · range · free
   Töne in match/sustain als Stufen der Dur-Tonleiter: "1 2 3 4 5 6 7 8",
   "_5" = eine Oktave tiefer, "^2" = eine Oktave höher, ":2" = 2 Schläge,
   "b3" = um einen Halbton erniedrigt, "#4" = erhöht.
   ========================================================================== */

const yt = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);

const COURSES = {
/* ------------------------------------------------------------------ */
adult: {
  name: "Erwachsene",
  blurb: "Acht Stufen von der Atmung bis zum ersten Lied. Eine Lektion pro Tag, je 10 bis 15 Minuten.",
  stages: [
  { title: "Haltung und Atmung", intro: "Bevor du singst, baust du dein Instrument auf: aufrechter, lockerer Körper und ein ruhiger, tiefer Atem.",
    lessons: [
    { id: "a1", title: "Dein Körper als Instrument", min: 10, goal: "Eine Singhaltung finden und tief in den Bauch atmen.",
      steps: [
        { type: "info", title: "Die Singhaltung", text: "Stell dich hüftbreit hin, Knie locker, nicht durchgedrückt. Stell dir einen Faden vor, der dich am Scheitel sanft nach oben zieht. Schultern einmal hochziehen und fallen lassen. Der Kiefer hängt locker, die Zunge liegt vorne an den unteren Zähnen.",
          bullets: ["Gewicht auf beide Füsse verteilen", "Brustbein leicht angehoben, ohne Hohlkreuz", "Blick geradeaus, Kinn nicht nach vorne schieben"] },
        { type: "breath", title: "Bauchatmung", text: "Lege eine Hand auf den Bauch. Beim Einatmen wölbt sich der Bauch nach vorne, die Schultern bleiben unten.", pattern: [4, 2, 6, 1], rounds: 4 },
        { type: "hiss", title: "Langes Zischen", text: "Atme tief ein und lass die Luft auf einem gleichmässigen «sss» ausströmen, so lange es angenehm geht. Nicht pressen.", goal: 15 },
        { type: "sustain", title: "Erster Summton", text: "Summe auf «mmm» einen bequemen Ton. Die Lippen dürfen dabei leicht kribbeln.", note: "3", secs: 5, syl: "mmm" }
      ],
      links: [["Singhaltung erklärt (Videos)", yt("Singhaltung richtig stehen Gesang")], ["Bauchatmung beim Singen (Videos)", yt("Bauchatmung Singen Übung")]] },
    { id: "a2", title: "Das Zwerchfell entdecken", min: 12, goal: "Den Atemmuskel spüren und bewusst einsetzen.",
      steps: [
        { type: "info", title: "Was ist das Zwerchfell?", text: "Das Zwerchfell ist ein kuppelförmiger Muskel unter der Lunge. Beim Einatmen senkt es sich und schafft Platz für Luft, deshalb wölbt sich der Bauch. Beim Singen bremst es die Ausatmung, damit der Ton gleichmässig bleibt.",
          bullets: ["Hecheln wie ein Hund: 10 Sekunden, der Bauch federt", "Fünfmal kräftig «ha!» lachen und den Impuls im Bauch spüren"] },
        { type: "breath", title: "4-7-8 Atmung", text: "Diese Atmung beruhigt und verlängert die Ausatmung.", pattern: [4, 7, 8, 0], rounds: 3 },
        { type: "hiss", title: "Zischen mit Impulsen", text: "Atme ein und zische «ts-ts-ts-ts» in kurzen Stössen, danach ein langes «sss». Ziel: länger als gestern.", goal: 18 },
        { type: "sustain", title: "Summen auf mmm", text: "Summe ruhig und gleichmässig. Achte darauf, dass der Ton nicht absinkt, wenn die Luft knapp wird.", note: "1", secs: 6, syl: "mmm" }
      ],
      links: [["Zwerchfell beim Singen (Videos)", yt("Zwerchfell Singen erklärt")], ["Stimmbildung auf Wikipedia", "https://de.wikipedia.org/wiki/Stimmbildung"]] },
    { id: "a3", title: "Die Atemstütze", min: 12, goal: "Luft dosieren, damit der Ton ruhig und tragend wird.",
      steps: [
        { type: "info", title: "Stütze heisst Gleichgewicht", text: "Stütze ist kein Drücken. Die Einatemmuskeln arbeiten beim Singen weiter und bremsen die Luft. Stell dir vor, du atmest gegen einen sanften Widerstand aus, wie durch einen Strohhalm." },
        { type: "glide", title: "Lippenflattern", text: "Lass die Lippen auf «brrr» flattern wie ein Pferd und gleite dabei von tief nach hoch und zurück. Wenn die Lippen stoppen, ist zu wenig Luft oder zu viel Spannung im Spiel. Leg notfalls zwei Finger an die Wangen.", secs: 8 },
        { type: "hiss", title: "Zischen gegen den Widerstand", text: "Halte die Flanken weit, während du zischst. Die Luft soll gleich laut bleiben bis zum Schluss.", goal: 20 },
        { type: "sustain", title: "Langes «a»", text: "Singe auf einem offenen «a» und halte den Ton ruhig. Stell dir vor, der Ton fliesst nach vorne aus dem Mund.", note: "3", secs: 6, syl: "a" }
      ],
      links: [["Atemstütze üben (Videos)", yt("Atemstütze Gesang Übung")], ["Lippenflattern / Lip Trill (Videos)", yt("Lippenflattern Gesang Übung")]] }
  ]},
  { title: "Töne treffen", intro: "Hören, merken, nachsingen. Hier trainierst du die Verbindung zwischen Ohr und Stimme.",
    lessons: [
    { id: "a4", title: "Der erste Ton", min: 10, goal: "Einen vorgespielten Ton sicher treffen.",
      steps: [
        { type: "info", title: "So funktioniert die Übung", text: "Die App spielt dir Töne vor. Danach singst du nach, die farbigen Balken zeigen den Zielton, deine Linie zeigt, was du singst. Grün heisst getroffen. Kopfhörer helfen, sind aber nicht nötig." },
        { type: "match", title: "Einzeltöne", text: "Singe jeden Ton auf «na» nach.", notes: "1:2 3:2 5:2 3:2 1:2", syl: "na", bpm: 70 },
        { type: "match", title: "Gleich und anders", text: "Zweimal derselbe Ton, dann ein Schritt.", notes: "1 1 2:2 2 2 3:2 3 3 1:2", syl: "na", bpm: 76 }
      ],
      links: [["Gehörbildung: Töne nachsingen (Videos)", yt("Töne treffen lernen singen Übung")], ["Gehörbildungs-Übungen (musictheory.net)", "https://www.musictheory.net/exercises"]] },
    { id: "a5", title: "Fünf Töne", min: 12, goal: "Eine Fünftonreihe sauber hinauf und hinunter singen.",
      steps: [
        { type: "match", title: "Fünftonreihe", text: "Singe die Tonleiter auf «ma» hinauf und wieder hinunter.", notes: "1 2 3 4 5 4 3 2 1:2", syl: "ma", bpm: 84, keys: [0, 2] },
        { type: "info", title: "Tipp für Schritte", text: "Kleine Schritte geraten oft zu klein, besonders aufwärts. Denk beim Hinaufsingen an eine Treppe, auf der jede Stufe gleich hoch ist. Abwärts nicht absacken lassen, sondern jede Stufe mit gleicher Energie singen." },
        { type: "match", title: "Mit Vokalwechsel", text: "Gleiche Reihe, jeder Ton ein anderer Vokal: «a e i o u o i e a».", notes: "1 2 3 4 5 4 3 2 1:2", syl: "a e i o u o i e a", bpm: 80, keys: [1] }
      ],
      links: [["Tonleiter singen (Videos)", yt("Tonleiter singen Einsingen")]] },
    { id: "a6", title: "Intervalle hören", min: 12, goal: "Terz, Quinte und Oktave erkennen und singen.",
      steps: [
        { type: "info", title: "Merkhilfen", text: "Die grosse Terz klingt wie der Anfang von «Oh when the saints» (1–3), die Quinte wie der Anfang von «Morgen kommt der Weihnachtsmann» (1–5), die Oktave wie der Anfang von «Somewhere over the rainbow» (1–8). Solche Liedanfänge helfen dir, Abstände im Kopf zu speichern." },
        { type: "match", title: "Terzen", notes: "1:2 3:2 1:2 3:2 5:2 3:2", syl: "la", bpm: 72 },
        { type: "match", title: "Quinte und Oktave", notes: "1:2 5:2 1:2 8:2 5:2 1:2", syl: "la", bpm: 70 }
      ],
      links: [["Intervalltrainer (tonedear.com)", "https://tonedear.com/ear-training/intervals"], ["Intervalle erklärt (Wikipedia)", "https://de.wikipedia.org/wiki/Intervall_(Musik)"]] }
  ]},
  { title: "Resonanz", intro: "Resonanz macht die Stimme gross, ohne dass du lauter drücken musst.",
    lessons: [
    { id: "a7", title: "Summen und Maske", min: 10, goal: "Den Ton vorne im Gesicht spüren.",
      steps: [
        { type: "info", title: "Die Maske", text: "Sänger sprechen vom «Singen in die Maske»: Lippen, Nase und Wangenknochen vibrieren mit. Summe und berühre dabei leicht deine Nase. Spürst du ein Kribbeln? Genau dorthin soll der Klang später auch bei offenen Vokalen." },
        { type: "sustain", title: "mmm", note: "1", secs: 6, syl: "mmm" },
        { type: "sustain", title: "ng (wie in «sing»)", text: "Die Zunge liegt hinten am Gaumen, der Ton geht durch die Nase.", note: "3", secs: 6, syl: "ng" },
        { type: "match", title: "Summen auf der Reihe", notes: "1 2 3 4 5 4 3 2 1:2", syl: "mmm", bpm: 80, keys: [0, 1] }
      ],
      links: [["Resonanz im Gesang (Videos)", yt("Resonanz Gesang Maske Übung")]] },
    { id: "a8", title: "Vokale ausgleichen", min: 12, goal: "Alle Vokale mit gleicher Klangfarbe singen.",
      steps: [
        { type: "info", title: "Ein Raum für alle Vokale", text: "Bei «i» und «e» wird der Klang oft eng, bei «a» flach. Lass den Raum im Mund ähnlich: Kiefer locker offen, nur Zunge und Lippen formen den Vokal. Denk bei «i» etwas «ü», bei «e» etwas «ö» mit." },
        { type: "sustain", title: "a – e – i – o – u", text: "Wechsle auf einem Ton langsam die Vokale, ohne dass die Lautstärke springt.", note: "3", secs: 8, syl: "a e i o u" },
        { type: "match", title: "Dreiklang auf «ni»", notes: "1 3 5 3 1:2", syl: "ni", bpm: 80, keys: [0, 2, 4] }
      ],
      links: [["Vokalausgleich (Videos)", yt("Vokale ausgleichen singen Übung")]] },
    { id: "a9", title: "Heller, tragender Klang", min: 12, goal: "Mit wenig Kraft viel Klang erzeugen.",
      steps: [
        { type: "info", title: "Das «nj»", text: "Ein freches «njä» wie ein quengelndes Kind bringt den Klang nach vorne. Klingt erst komisch, trainiert aber Brillanz. Danach den gleichen Sitz bei schönem Vokal behalten." },
        { type: "match", title: "Njä-Arpeggio", notes: "1 3 5 8 5 3 1:2", syl: "njä", bpm: 84, keys: [0, 1, 2] },
        { type: "match", title: "Gleich auf «a»", notes: "1 3 5 8 5 3 1:2", syl: "a", bpm: 84, keys: [0] }
      ],
      links: [["Twang / Brillanz im Gesang (Videos)", yt("Twang Gesang Übung deutsch")]] }
  ]},
  { title: "Register", intro: "Bruststimme, Kopfstimme und der Übergang dazwischen. Ziel ist eine Stimme ohne Bruch.",
    lessons: [
    { id: "a10", title: "Die Bruststimme", min: 10, goal: "Tiefe Töne voll und entspannt singen.",
      steps: [
        { type: "info", title: "Bruststimme", text: "Die Bruststimme ist deine Sprechstimme. Leg eine Hand aufs Brustbein und sprich «hallo» tief und gemütlich: Die Brust vibriert. Diese Vibration nehmen wir in die tiefen Töne mit, ohne zu drücken." },
        { type: "match", title: "Abwärts auf «a»", notes: "5 4 3 2 1:2", syl: "a", bpm: 76, keys: [0, -2] },
        { type: "sustain", title: "Tiefer Halteton", note: "1", secs: 6, syl: "o" }
      ],
      links: [["Bruststimme erklärt (Videos)", yt("Bruststimme Kopfstimme Unterschied")], ["Stimmregister (Wikipedia)", "https://de.wikipedia.org/wiki/Register_(Stimme)"]] },
    { id: "a11", title: "Die Kopfstimme", min: 12, goal: "Hohe Töne leicht und ohne Druck erreichen.",
      steps: [
        { type: "info", title: "Kopfstimme", text: "Imitiere eine Eule: «huu» hoch und weich. Das ist Kopfstimme. Sie klingt leiser und luftiger, und das darf sie am Anfang auch. Männer erleben sie oft als Falsett, das ist ein guter Startpunkt." },
        { type: "glide", title: "Eulen-Sirene", text: "Gleite auf «u» von der Mitte nach ganz oben und wieder hinunter. Leise bleiben.", secs: 8 },
        { type: "match", title: "Von oben herab", notes: "8 5 3 1:2", syl: "u", bpm: 72, keys: [0, 1, 2] }
      ],
      links: [["Kopfstimme finden (Videos)", yt("Kopfstimme finden Übung")]] },
    { id: "a12", title: "Der Übergang", min: 14, goal: "Bruch zwischen den Registern glätten.",
      steps: [
        { type: "info", title: "Passaggio", text: "Im Übergang kippt die Stimme gern. Hilfreich: leiser werden, Vokal etwas abdunkeln («a» Richtung «o»), nicht mit mehr Kraft durchpressen. Konsonanten wie «g» helfen, weil sie den Kehlkopf ruhig halten." },
        { type: "glide", title: "Sirene durch den Bruch", text: "Auf «ng» oder «brrr» gleiten, die Stelle mit dem Knick ganz sanft passieren.", secs: 10 },
        { type: "match", title: "«Gug» Oktavsprung", notes: "1 5 8 5 1:2", syl: "gug", bpm: 80, keys: [0, 2, 4] }
      ],
      links: [["Passaggio und Registerbruch (Videos)", yt("Registerbruch Übergang singen Übung")]] }
  ]},
  { title: "Beweglichkeit", intro: "Schnelle Noten, präzise Sprünge und leichte Läufe.",
    lessons: [
    { id: "a13", title: "Staccato", min: 10, goal: "Kurze, präzise Töne aus der Atemstütze.",
      steps: [
        { type: "info", title: "Kurz und leicht", text: "Staccato heisst kurz und abgesetzt. Jeder Ton entsteht aus einem kleinen Bauchimpuls wie beim Lachen «ha ha ha», nicht aus dem Hals." },
        { type: "match", title: "Gelachte Dreiklänge", notes: "1 3 5 8 5 3 1:2", syl: "ha", bpm: 96, keys: [0, 2] }
      ],
      links: [["Staccato singen (Videos)", yt("Staccato singen Übung")]] },
    { id: "a14", title: "Läufe", min: 12, goal: "Schnelle Tonfolgen sauber singen.",
      steps: [
        { type: "match", title: "Langsam", notes: "1 2 3 4 5 4 3 2 1:2", syl: "a", bpm: 92 },
        { type: "match", title: "Schneller", notes: "1 2 3 4 5 4 3 2 1:2", syl: "a", bpm: 120, keys: [0, 2] },
        { type: "info", title: "Tipp", text: "Bei Läufen nicht jeden Ton neu anstossen. Die Luft fliesst durch, die Töne perlen auf dem Atemstrom. Wenn es schmiert, erst langsamer werden." }
      ],
      links: [["Läufe / Riffs üben (Videos)", yt("Gesang Läufe üben Anfänger")]] },
    { id: "a15", title: "Arpeggios über die Oktave", min: 12, goal: "Grosse Sprünge sicher meistern.",
      steps: [
        { type: "match", title: "Arpeggio mit Spitze", notes: "1 3 5 8 10 8 5 3 1:2", syl: "a", bpm: 96, keys: [0, 1] },
        { type: "match", title: "Oktavsprünge", notes: "1:2 8:2 1:2 8:2 1:2", syl: "wa", bpm: 76 }
      ],
      links: [["Arpeggio Einsingen (Videos)", yt("Arpeggio Einsingübung")]] }
  ]},
  { title: "Ausdauer und Dynamik", intro: "Lange Phrasen tragen und zwischen leise und laut gestalten.",
    lessons: [
    { id: "a16", title: "Messa di voce", min: 12, goal: "Einen Ton anschwellen und abschwellen lassen.",
      steps: [
        { type: "info", title: "An- und abschwellen", text: "Beginne leise, werde langsam lauter und wieder leiser, auf einem einzigen Atem. Die Tonhöhe soll dabei gleich bleiben. Das ist eine der wichtigsten klassischen Übungen überhaupt." },
        { type: "sustain", title: "Leise – laut – leise", note: "3", secs: 8, syl: "a", dyn: true },
        { type: "sustain", title: "Noch einmal höher", note: "5", secs: 8, syl: "o", dyn: true }
      ],
      links: [["Messa di voce (Videos)", yt("messa di voce Übung")]] },
    { id: "a17", title: "Lange Phrasen", min: 12, goal: "Luft für lange Linien einteilen.",
      steps: [
        { type: "breath", title: "Schnell ein, lang aus", pattern: [2, 0, 10, 0], rounds: 4 },
        { type: "hiss", title: "Rekord-Zischen", goal: 25 },
        { type: "match", title: "Doppelte Reihe auf einem Atem", notes: "1 2 3 4 5 6 7 8 7 6 5 4 3 2 1:2", syl: "a", bpm: 104 }
      ],
      links: [["Luft einteilen beim Singen (Videos)", yt("Atem einteilen Singen lange Töne")]] },
    { id: "a18", title: "Leise singen", min: 10, goal: "Auch leise Töne stabil halten.",
      steps: [
        { type: "info", title: "Leise ist schwer", text: "Leise singen verlangt mehr Kontrolle als laut. Halte die Stütze, auch wenn wenig Luft fliesst. Stell dir vor, du singst einem schlafenden Kind etwas vor." },
        { type: "sustain", title: "Piano-Ton", note: "5", secs: 6, syl: "u" },
        { type: "match", title: "Leise Reihe", notes: "5 4 3 2 1:2", syl: "no", bpm: 72 }
      ],
      links: [["Leise singen lernen (Videos)", yt("leise singen lernen Übung")]] }
  ]},
  { title: "Aussprache und Ausdruck", intro: "Text verständlich machen und Gefühl transportieren.",
    lessons: [
    { id: "a19", title: "Konsonanten", min: 10, goal: "Deutlich artikulieren, ohne den Klang zu verlieren.",
      steps: [
        { type: "info", title: "Zungenbrecher", text: "Sprich langsam, dann schneller, dann singe auf einem Ton: «Fischers Fritz fischt frische Fische.» – «Blaukraut bleibt Blaukraut und Brautkleid bleibt Brautkleid.» Konsonanten kurz und präzise, Vokale lang." },
        { type: "match", title: "la le li lo lu", notes: "1 2 3 4 5 4 3 2 1:2", syl: "la le li lo lu lo li le la", bpm: 100, keys: [0, 2] }
      ],
      links: [["Artikulation im Gesang (Videos)", yt("Artikulation Gesang Übungen")]] },
    { id: "a20", title: "Legato", min: 12, goal: "Töne ohne Lücke verbinden.",
      steps: [
        { type: "info", title: "Wie eine Perlenkette", text: "Legato heisst gebunden: Der Ton reisst zwischen den Noten nicht ab. Die App zeigt dir Lücken in deiner Linie. Je weniger Lücken, desto besser." },
        { type: "match", title: "Gebundene Terzen", notes: "1:2 3:2 5:2 3:2 1:4", syl: "a", bpm: 72, keys: [0, 2] },
        { type: "glide", title: "Langsame Sirene ohne Abriss", secs: 10 }
      ],
      links: [["Legato singen (Videos)", yt("Legato singen Übung")]] },
    { id: "a21", title: "Gefühl", min: 12, goal: "Mit derselben Melodie verschiedene Stimmungen ausdrücken.",
      steps: [
        { type: "info", title: "Eine Melodie, vier Gefühle", text: "Singe die gleiche kurze Reihe viermal: fröhlich, traurig, geheimnisvoll, stolz. Was verändert sich? Tempo, Lautstärke, Klangfarbe, Gesichtsausdruck. Ausdruck beginnt im Gesicht und in den Augen." },
        { type: "match", title: "Fröhlich", notes: "1 3 5 6 5 3 1:2", syl: "la", bpm: 110 },
        { type: "match", title: "Traurig", notes: "1 b3 5 6 5 b3 1:2", syl: "u", bpm: 66 },
        { type: "free", title: "Frei gestalten", text: "Singe die Reihe noch zweimal: geheimnisvoll und stolz. Nimm dich ruhig mit dem Handy auf und hör dir an, was anders klingt.", secs: 60 }
      ],
      links: [["Ausdruck beim Singen (Videos)", yt("Ausdruck Gefühl beim Singen Tipps")]] }
  ]},
  { title: "Lieder", intro: "Jetzt kommt alles zusammen. Alle Lieder sind traditionell und frei verwendbar.",
    lessons: [
    { id: "a22", title: "Ode an die Freude", min: 14, goal: "Eine ganze Melodie sauber singen.",
      steps: [
        { type: "info", title: "Beethovens Melodie", text: "Die Melodie aus Beethovens 9. Sinfonie (Text: Friedrich Schiller) bewegt sich fast nur in Schritten. Erst auf «la» lernen, dann mit Text: «Freude, schöner Götterfunken, Tochter aus Elysium»." },
        { type: "match", title: "Erste Zeile", notes: "3 3 4 5 5 4 3 2 1 1 2 3 3:1.5 2:0.5 2:2", syl: "la", bpm: 100 },
        { type: "match", title: "Zweite Zeile", notes: "3 3 4 5 5 4 3 2 1 1 2 3 2:1.5 1:0.5 1:2", syl: "la", bpm: 100 }
      ],
      links: [["Ode an die Freude (Wikipedia)", "https://de.wikipedia.org/wiki/An_die_Freude"], ["Mitsing-Videos", yt("Ode an die Freude zum Mitsingen")]] },
    { id: "a23", title: "Bruder Jakob im Kanon", min: 14, goal: "Die eigene Stimme halten, während eine andere singt.",
      steps: [
        { type: "match", title: "Melodie lernen", notes: "1 2 3 1 1 2 3 1 3 4 5:2 3 4 5:2", syl: "la", bpm: 100 },
        { type: "match", title: "Zweiter Teil", notes: "5:0.5 6:0.5 5:0.5 4:0.5 3 1 5:0.5 6:0.5 5:0.5 4:0.5 3 1 1 _5 1:2 1 _5 1:2", syl: "la", bpm: 100 },
        { type: "info", title: "Kanon", text: "Im Werkzeug «Klavier» kannst du die Melodie vorspielen lassen. Noch schöner: Singe mit einer zweiten Person, die zwei Takte später einsetzt. Bleib bei deiner Melodie, auch wenn es um dich herum anders klingt." }
      ],
      links: [["Bruder Jakob als Kanon (Videos)", yt("Bruder Jakob Kanon")]] },
    { id: "a24", title: "Abschluss: Wo stehst du?", min: 15, goal: "Den Fortschritt messen und weitermachen.",
      steps: [
        { type: "range", title: "Tonumfang neu messen", text: "Vergleiche mit deiner ersten Messung. Viele gewinnen in den ersten Wochen zwei bis vier Töne dazu." },
        { type: "glide", title: "Sirene über den ganzen Umfang", secs: 10 },
        { type: "info", title: "Wie geht es weiter?", text: "Gratuliere! Wiederhole Lektionen mit niedrigen Punkten, probiere die Stilrichtungen aus und überlege dir ein paar Stunden bei einer Gesangslehrerin oder einem Gesangslehrer. Eine App ersetzt kein Ohr, das dir direkt zuhört." }
      ],
      links: [["Musikschulen in der Schweiz", "https://www.musikschule.ch"]] }
  ]}
  ]
},

kids: {
  name: "Kinder",
  blurb: "Zwölf kurze Singspiele für Kinder ab etwa 4 Jahren, zum gemeinsamen Singen mit Mama oder Papa.",
  stages: [
  { title: "Die Stimme entdecken", intro: "Spielerisch Töne machen, summen und tönen.",
    lessons: [
    { id: "k1", title: "Hallo, Stimme!", min: 6, goal: "Die Stimme aufwecken.",
      steps: [
        { type: "info", title: "Aufwachen wie ein Löwe", text: "Strecken, gähnen wie ein grosser Löwe, dann schütteln wie ein nasser Hund. Jetzt die Lippen pusten lassen wie ein Pferd: «brrr»!", kid: true },
        { type: "sustain", title: "Bienchen summen", text: "Summt zusammen wie ein Bienchen: «sssummm». Wer schafft es lange?", note: "3", secs: 4, syl: "summ" }
      ],
      links: [["Chrome Music Lab: Spielen mit Tönen", "https://musiclab.chromeexperiments.com/"]] },
    { id: "k2", title: "Feuerwehr-Sirene", min: 6, goal: "Hoch und tief spielerisch entdecken.",
      steps: [
        { type: "info", title: "Tatü-tata", text: "Die Feuerwehr fährt los! Mit «uuu» ganz tief anfangen und hoch hinauf wie eine Sirene, dann wieder runter. Mit der Hand die Höhe zeigen.", kid: true },
        { type: "glide", title: "Sirene", text: "Rauf und runter mit «uuu»!", secs: 6 }
      ],
      links: [["Sirenen-Spiele für Kinder (Videos)", yt("Kinder Stimme Sirene Spiel singen")]] },
    { id: "k3", title: "Der Kuckuck ruft", min: 6, goal: "Zwei Töne treffen.",
      steps: [
        { type: "info", title: "Kuckuck!", text: "Der Kuckuck ruft immer gleich: einen hohen und einen tieferen Ton. Hört gut zu und ruft zurück!", kid: true },
        { type: "match", title: "Kuckuck rufen", notes: "5:2 3:2 5:2 3:2", syl: "kuk kuck kuk kuck", bpm: 80 }
      ],
      links: [["Kuckucks-Lieder (Videos)", yt("Kuckuck Kinderlied")]] }
  ]},
  { title: "Hören und nachsingen", intro: "Echo-Spiele, Treppen und Atem-Abenteuer.",
    lessons: [
    { id: "k4", title: "Das Echo-Spiel", min: 6, goal: "Einen Ton nachsingen.",
      steps: [
        { type: "info", title: "Im Wald ruft das Echo", text: "Ihr seid in den Bergen. Die App ruft, ihr seid das Echo und ruft genau gleich zurück.", kid: true },
        { type: "match", title: "Echo", notes: "1:2 1:2 3:2 3:2 5:2 5:2", syl: "hoo", bpm: 80 }
      ],
      links: [] },
    { id: "k5", title: "Die Ton-Treppe", min: 7, goal: "Fünf Töne hinauf und hinunter.",
      steps: [
        { type: "info", title: "Treppensteigen", text: "Stellt euch vor, ihr lauft eine Treppe hinauf und wieder hinunter. Bei jedem Ton eine Stufe! Dabei könnt ihr auch mit den Händen die Stufen zeigen.", kid: true },
        { type: "match", title: "Treppe", notes: "1 2 3 4 5:2 5 4 3 2 1:2", syl: "la", bpm: 76 }
      ],
      links: [] },
    { id: "k6", title: "Luftballon und Schlange", min: 6, goal: "Tief atmen und lange ausatmen.",
      steps: [
        { type: "breath", title: "Luftballon aufblasen", text: "Der Bauch ist ein Luftballon. Beim Einatmen wird er dick, beim Ausatmen langsam wieder dünn.", pattern: [3, 1, 4, 0], rounds: 3 },
        { type: "hiss", title: "Die Schlange zischt", text: "Wie lange kann die Schlange zischen? «sssss»", goal: 8 }
      ],
      links: [["Atemspiele für Kinder (Videos)", yt("Atemübungen Kinder Spiel")]] }
  ]},
  { title: "Kleine Lieder", intro: "Traditionelle Kinderlieder Stück für Stück.",
    lessons: [
    { id: "k7", title: "Leise Maus, lauter Löwe", min: 6, goal: "Leise und laut singen.",
      steps: [
        { type: "info", title: "Tierkonzert", text: "Die Maus singt ganz leise «piep». Der Löwe singt laut «uaah», aber ohne zu schreien. Wechselt euch ab!", kid: true },
        { type: "sustain", title: "Mäuschen (leise)", note: "5", secs: 3, syl: "piep" },
        { type: "sustain", title: "Löwe (laut)", note: "1", secs: 3, syl: "ua" }
      ],
      links: [] },

/* ==========================================================================
   Audio: Klangerzeugung, Mikrofon, Tonhöhenerkennung (YIN) und Auswertung.
   YIN nach de Cheveigné & Kawahara (2002), wie in aubio und pitchy.
   ========================================================================== */

const NOTE_DE = ["C", "Cis", "D", "Dis", "E", "F", "Fis", "G", "Gis", "A", "B", "H"];
const NOTE_SOL = ["Do", "Do#", "Re", "Re#", "Mi", "Fa", "Fa#", "Sol", "Sol#", "La", "Sib", "Si"];
const DEG = { 1: 0, 2: 2, 3: 4, 4: 5, 5: 7, 6: 9, 7: 11, 8: 12, 9: 14, 10: 16, 11: 17, 12: 19 };

const freqToMidi = f => 69 + 12 * Math.log2(f / 440);
const midiToFreq = m => 440 * Math.pow(2, (m - 69) / 12);
function noteName(m, sol) {
  const r = Math.round(m), n = ((r % 12) + 12) % 12, o = Math.floor(r / 12) - 1;
  return (sol ? NOTE_SOL : NOTE_DE)[n] + o;
}
const foldCents = c => ((c + 600) % 1200 + 1200) % 1200 - 600;
const median = a => { if (!a.length) return NaN; const s = [...a].sort((x, y) => x - y); const m = s.length >> 1; return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
const mean = a => a.reduce((s, x) => s + x, 0) / (a.length || 1);
const stdev = a => { const m = mean(a); return Math.sqrt(mean(a.map(x => (x - m) ** 2))); };
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

/* Notenfolge "1 2 3:2 _5 b3" -> [{semi, beats, syl}] */
function parseNotes(str, sylStr) {
  const syls = (sylStr || "").split(/\s+/).filter(Boolean);
  return str.trim().split(/\s+/).map((tok, i) => {
    let [d, b] = tok.split(":");
    let oct = 0, acc = 0;
    while (d[0] === "_" || d[0] === "^") { oct += d[0] === "_" ? -12 : 12; d = d.slice(1); }
    if (d[0] === "b") { acc = -1; d = d.slice(1); }
    if (d[0] === "#") { acc = 1; d = d.slice(1); }
    return { semi: DEG[+d] + acc + oct, beats: b ? +b : 1, syl: syls.length ? syls[i % syls.length] : "" };
  });
}

/* ---------- YIN ---------- */
function yin(buf, sr, minF = 65, maxF = 1100, thr = 0.15) {
  const maxTau = Math.min(Math.floor(sr / minF), buf.length >> 1);
  const minTau = Math.floor(sr / maxF);
  const W = buf.length - maxTau;
  const d = new Float32Array(maxTau + 1);
  for (let tau = 1; tau <= maxTau; tau++) {
    let s = 0;
    for (let i = 0; i < W; i++) { const x = buf[i] - buf[i + tau]; s += x * x; }
    d[tau] = s;
  }
  // kumulierte mittlere normierte Differenz
  let run = 0; d[0] = 1;
  for (let tau = 1; tau <= maxTau; tau++) { run += d[tau]; d[tau] = run ? d[tau] * tau / run : 1; }
  let tau = -1;
  for (let t = minTau; t <= maxTau; t++) {
    if (d[t] < thr) { while (t + 1 <= maxTau && d[t + 1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 0) return { f: -1, c: 0 };
  // parabolische Interpolation
  const a = d[tau - 1] ?? d[tau], b = d[tau], c = d[tau + 1] ?? d[tau];
  const den = a + c - 2 * b;
  const better = den ? tau + (a - c) / (2 * den) : tau;
  return { f: sr / better, c: 1 - b };
}
function rmsOf(buf) { let s = 0; for (let i = 0; i < buf.length; i++) s += buf[i] * buf[i]; return Math.sqrt(s / buf.length); }

/* ---------- Engine ---------- */
const Engine = {
  ctx: null, master: null, stream: null, analyser: null, live: null, // live: true/false/null(unbekannt)
  listeners: new Set(), raf: 0, buf: null, t0: 0, smooth: [],
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.6;
      const comp = this.ctx.createDynamicsCompressor();
      this.master.connect(comp); comp.connect(this.ctx.destination);
    }
    if (this.ctx.state === "suspended") this.ctx.resume();
    return this.ctx;
  },
  now() { return this.ensure().currentTime; },
  /* Klavierähnlicher Ton */
  tone(midi, when, dur, vol = 0.5) {
    const ctx = this.ensure(), f = midiToFreq(midi);
    const g = ctx.createGain(); g.connect(this.master);
    const parts = [[1, 1, "triangle"], [2, 0.35, "sine"], [3, 0.12, "sine"], [4, 0.05, "sine"]];
    const oscs = parts.map(([h, a, type]) => {
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.type = type; o.frequency.value = f * h; og.gain.value = a;
      o.connect(og); og.connect(g); return o;
    });
    const end = when + Math.max(dur, 0.15);
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(vol, when + 0.012);
    g.gain.exponentialRampToValueAtTime(vol * 0.45, when + 0.25);
    g.gain.setTargetAtTime(vol * 0.28, when + 0.25, 0.6);
    g.gain.setTargetAtTime(0.0001, end, 0.08);
    oscs.forEach(o => { o.start(when); o.stop(end + 0.5); });
  },
  click(when, accent) {
    const ctx = this.ensure(), o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = accent ? 1500 : 1000; o.connect(g); g.connect(this.master);
    g.gain.setValueAtTime(0.25, when); g.gain.exponentialRampToValueAtTime(0.001, when + 0.05);
    o.start(when); o.stop(when + 0.06);
  },
  /* Mikrofon live starten. Gibt true/false zurück. */
  async startMic() {
    if (this.stream) return true;
    try {
      if (!navigator.mediaDevices?.getUserMedia) throw new Error("kein getUserMedia");
      this.ensure();
      this.stream = await Promise.race([
        navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }),
        new Promise((_, rej) => setTimeout(() => rej(new Error("Zeitüberschreitung")), 15000))]);
      const src = this.ctx.createMediaStreamSource(this.stream);
      this.analyser = this.ctx.createAnalyser(); this.analyser.fftSize = 2048;
      src.connect(this.analyser);
      this.buf = new Float32Array(this.analyser.fftSize);
      this.live = true; this.loop();
      return true;
    } catch (e) { this.live = false; this.stream = null; return false; }
  },
  stopMic() {
    cancelAnimationFrame(this.raf); this.raf = 0;
    this.stream?.getTracks().forEach(t => t.stop()); this.stream = null;
  },
  loop() {
    const step = () => {
      if (!this.stream) return;
      this.analyser.getFloatTimeDomainData(this.buf);
      const r = rmsOf(this.buf);
      let midi = null, clar = 0;
      if (r > 0.008) {
        const { f, c } = yin(this.buf, this.ctx.sampleRate);
        if (f > 0 && c > 0.8) { midi = freqToMidi(f); clar = c; }
      }
      // Median-Glättung gegen Ausreisser
      if (midi != null) { this.smooth.push(midi); if (this.smooth.length > 5) this.smooth.shift(); midi = median(this.smooth); }
      else this.smooth = [];
      const fr = { t: this.ctx.currentTime, midi, rms: r, clar };
      this.listeners.forEach(fn => fn(fr));
      this.raf = requestAnimationFrame(step);
    };
    this.raf = requestAnimationFrame(step);
  },
  on(fn) { this.listeners.add(fn); return () => this.listeners.delete(fn); },
  /* Aufnahme (Datei) analysieren -> Spur */
  async analyzeFile(file) {
    const ctx = this.ensure();
    const ab = await file.arrayBuffer();
    const audio = await new Promise((res, rej) => { const p = ctx.decodeAudioData(ab, res, rej); if (p?.then) p.then(res, rej); });
    const data = audio.getChannelData(0), sr = audio.sampleRate;
    const N = 2048, hop = 512, track = []; let sm = [];
    let peak = 0; for (let i = 0; i < data.length; i += 64) peak = Math.max(peak, Math.abs(data[i]));
    const gate = Math.max(0.006, peak * 0.04);
    for (let i = 0; i + N < data.length; i += hop) {
      const frame = data.subarray(i, i + N), r = rmsOf(frame);
      let midi = null;
      if (r > gate) { const { f, c } = yin(frame, sr); if (f > 0 && c > 0.8) midi = freqToMidi(f); }
      if (midi != null) { sm.push(midi); if (sm.length > 5) sm.shift(); midi = median(sm); } else sm = [];
      track.push({ t: i / sr, midi, rms: r });
    }
    return { track, duration: data.length / sr };
  }
};

/* ==========================================================================
   Auswertung
   ========================================================================== */

/* Spur in stabile Tonsegmente zerlegen */
function segmentTrack(track, minDur = 0.12) {
  const segs = []; let cur = null, lastT = -1;
  for (const fr of track) {
    if (fr.midi == null) { if (cur && fr.t - lastT > 0.07) { segs.push(cur); cur = null; } continue; }
    if (cur && Math.abs(fr.midi - median(cur.v.slice(-6))) < 0.7 && fr.t - lastT < 0.1) { cur.v.push(fr.midi); cur.t1 = fr.t; }
    else { if (cur) segs.push(cur); cur = { t0: fr.t, t1: fr.t, v: [fr.midi] }; }
    lastT = fr.t;
  }
  if (cur) segs.push(cur);
  return segs.filter(s => s.t1 - s.t0 >= minDur).map(s => ({ ...s, m: median(s.v.slice(Math.floor(s.v.length * 0.2))) }));
}

/* Zielnoten und Segmente per Editierdistanz zuordnen (für Aufnahmen ohne Zeitbezug) */
function alignTargets(targets, segs) {
  const n = targets.length, m = segs.length, INF = 1e9;
  const D = Array.from({ length: n + 1 }, () => new Float64Array(m + 1).fill(INF));
  const B = Array.from({ length: n + 1 }, () => new Int8Array(m + 1));
  const SKIP_T = 1.4, SKIP_S = 0.5;
  D[0][0] = 0;
  for (let i = 0; i <= n; i++) for (let j = 0; j <= m; j++) {
    if (i && D[i - 1][j] + SKIP_T < D[i][j]) { D[i][j] = D[i - 1][j] + SKIP_T; B[i][j] = 1; }
    if (j && D[i][j - 1] + SKIP_S < D[i][j]) { D[i][j] = D[i][j - 1] + SKIP_S; B[i][j] = 2; }
    if (i && j) {
      const c = Math.min(Math.abs(foldCents((segs[j - 1].m - targets[i - 1].midi) * 100)) / 100, 3);
      if (D[i - 1][j - 1] + c < D[i][j]) { D[i][j] = D[i - 1][j - 1] + c; B[i][j] = 3; }
    }
  }
  const map = new Array(n).fill(null);
  let i = n, j = m;
  while (i || j) { const b = B[i][j]; if (b === 3) { map[i - 1] = segs[j - 1]; i--; j--; } else if (b === 1) i--; else j--; }
  return map;
}

function noteStats(values, target) {
  const devs = values.map(v => foldCents((v - target) * 100));
  const med = median(devs);
  const hit = devs.filter(d => Math.abs(d) <= 50).length / (devs.length || 1);
  const sd = devs.length > 2 ? stdev(devs) : 0;
  const octave = values.length ? Math.round((median(values) - target) / 12) : 0;
  return { med, hit, sd, octave, n: devs.length };
}

/* Tonfolge auswerten. live: Frames mit Zeit; sonst Zuordnung über Segmente */
function analyzeMatch(targets, track, live) {
  const notes = [];
  if (live) {
    for (const tg of targets) {
      const d = tg.t1 - tg.t0, from = tg.t0 + Math.min(0.18, d * 0.3);
      const fr = track.filter(f => f.t >= from && f.t <= tg.t1 + 0.05);
      const voiced = fr.filter(f => f.midi != null).map(f => f.midi);
      const vf = voiced.length / (fr.length || 1);
      const st = noteStats(voiced, tg.midi);
      notes.push({ tg, ...st, voicedFrac: vf, found: voiced.length >= 2, score: voiced.length >= 2 ? st.hit * Math.min(1, vf / 0.5) : 0 });
    }
  } else {
    const segs = segmentTrack(track);
    const map = alignTargets(targets, segs);
    targets.forEach((tg, i) => {
      const s = map[i];
      if (!s) { notes.push({ tg, found: false, score: 0, n: 0 }); return; }
      const st = noteStats(s.v.slice(Math.floor(s.v.length * 0.2)), tg.midi);
      notes.push({ tg, seg: s, ...st, voicedFrac: 1, found: true, score: st.hit });
    });
  }
  const found = notes.filter(n => n.found);
  const score = Math.round(100 * mean(notes.map(n => n.score)));
  const allDev = found.map(n => n.med);
  const avgDev = allDev.length ? mean(allDev) : 0;
  const avgSd = found.length ? mean(found.map(n => n.sd)) : 0;
  // hohe vs. tiefe Töne
  const sorted = [...found].sort((a, b) => a.tg.midi - b.tg.midi);
  const third = Math.max(1, Math.floor(sorted.length / 3));
  const lowDev = mean(sorted.slice(0, third).map(n => n.med));
  const highDev = mean(sorted.slice(-third).map(n => n.med));
  const octaves = found.map(n => n.octave);
  return { kind: "match", notes, score, avgDev, avgSd, lowDev, highDev, foundFrac: found.length / (notes.length || 1), octave: median(octaves) || 0 };
}

function analyzeSustain(target, track, opts = {}) {
  const v = track.filter(f => f.midi != null);
  const start = v.length ? v[0].t + 0.3 : 0;
  const use = v.filter(f => f.t >= start);
  const vals = use.map(f => f.midi);
  const st = noteStats(vals, target);
  const n = vals.length, third = Math.max(1, Math.floor(n / 3));
  const devs = vals.map(x => foldCents((x - target) * 100));
  const drift = n > 6 ? median(devs.slice(-third)) - median(devs.slice(0, third)) : 0;
  const dur = use.length ? use[use.length - 1].t - use[0].t + 0.3 : 0;
  const res = { kind: "sustain", target, ...st, drift, dur, score: Math.round(100 * st.hit * clamp(n / 20, 0, 1)) };
  if (opts.dyn && use.length > 8) {
    const db = use.map(f => 20 * Math.log10(f.rms + 1e-6));
    const sm = db.map((_, i) => mean(db.slice(Math.max(0, i - 4), i + 5)));
    const peakI = sm.indexOf(Math.max(...sm));
    res.dynRange = Math.max(...sm) - Math.min(...sm);
    res.peakPos = peakI / sm.length;
  }
  if (opts.vib && use.length > 30) {
    // Vibrato: Nulldurchgänge der trendbereinigten Tonhöhe
    const dt = (use[use.length - 1].t - use[0].t) / use.length;
    const w = Math.max(3, Math.round(0.4 / dt));
    const det = vals.map((x, i) => x - mean(vals.slice(Math.max(0, i - w), i + w + 1)));
    let zc = 0; for (let i = 1; i < det.length; i++) if (det[i - 1] < 0 && det[i] >= 0) zc++;
    res.vibRate = zc / (use[use.length - 1].t - use[0].t);
    res.vibExtent = 2 * stdev(det) * 100 * 1.41;
  }
  return res;
}

function analyzeGlide(track) {
  const v = track.filter(f => f.midi != null);
  if (v.length < 5) return { kind: "glide", score: 0, range: 0, empty: true };
  const vals = v.map(f => f.midi);
  const sorted = [...vals].sort((a, b) => a - b);
  const lo = sorted[Math.floor(sorted.length * 0.03)], hi = sorted[Math.floor(sorted.length * 0.97)];
  // Lücken und Sprünge innerhalb der Sirene
  let gaps = 0, jumps = [];
  for (let i = 1; i < v.length; i++) {
    const dt = v[i].t - v[i - 1].t;
    if (dt > 0.15 && dt < 1.5) gaps++;
    else if (dt < 0.06 && Math.abs(v[i].midi - v[i - 1].midi) > 1.8) jumps.push((v[i].midi + v[i - 1].midi) / 2);
  }
  const range = hi - lo;
  const score = Math.round(clamp(range / 14, 0, 1) * 70 + clamp(1 - (gaps + jumps.length) / 6, 0, 1) * 30);
  return { kind: "glide", lo, hi, range, gaps, jumps, score };
}

function analyzeRange(track) {
  const segs = segmentTrack(track, 0.2);
  if (!segs.length) return null;
  const ms = segs.map(s => s.m).sort((a, b) => a - b);
  return { low: Math.round(ms[0]), high: Math.round(ms[ms.length - 1]) };
}

/* Längster zusammenhängender Laut (Zischen) */
function analyzeHiss(track) {
  const rs = track.map(f => f.rms), peak = Math.max(...rs, 0);
  const gate = Math.max(0.004, peak * 0.15);
  let best = 0, start = null, lastOn = 0;
  for (const f of track) {
    if (f.rms > gate) { if (start == null) start = f.t; lastOn = f.t; best = Math.max(best, lastOn - start); }
    else if (start != null && f.t - lastOn > 0.35) start = null;
  }
  return best;
}

  info(step, body, next) {
    body.append(
      ...step.text.split(/\n+/).map(p => h("p", { class: "p-text" }, p)),
      step.bullets ? h("ul", { class: "bullets" }, ...step.bullets.map(b => h("li", {}, b))) : null,
      h("div", { class: "row" }, h("button", { class: "btn big", onclick: () => next(null) }, "Weiter")));
  },

  breath(step, body, next) {
    breathWidget(body, step.pattern, step.rounds, () => next(null));
  },

  free(step, body, next) {
    let left = step.secs, iv = null;
    const out = h("div", { class: "timer" }, fmt(left));
    const btn = h("button", { class: "btn" }, "Timer starten");
    btn.onclick = () => {
      if (iv) { clearInterval(iv); iv = null; btn.textContent = "Weiter laufen lassen"; return; }
      btn.textContent = "Pause";
      iv = setInterval(() => { left--; out.textContent = fmt(Math.max(0, left)); if (left <= 0) { clearInterval(iv); iv = null; btn.textContent = "Zeit um"; Engine.ensure(); Engine.tone(72, Engine.now(), 0.4, 0.3); } }, 1000);
    };
    stepCleanup.push(() => clearInterval(iv));
    body.append(out, h("div", { class: "row" }, btn, h("button", { class: "btn ghost", onclick: () => next(null) }, "Weiter")));
  },

  hiss(step, body, next) {
    const out = h("div", { class: "timer" }, "0,0 s");
    const goal = h("p", { class: "muted" }, `Ziel: ${step.goal} Sekunden`);
    const res = h("div", { class: "feedback" });
    const btn = h("button", { class: "btn big" }, "Start");
    let running = false, best = 0;
    const show = s => out.textContent = s.toFixed(1).replace(".", ",") + " s";
    const done = sec => {
      running = false; best = Math.max(best, sec);
      const sc = Math.round(clamp(sec / step.goal, 0, 1) * 100);
      res.innerHTML = "";
      res.append(scoreRing(sc), h("ul", { class: "tips" },
        h("li", {}, sec >= step.goal ? `Stark: ${sec.toFixed(1).replace(".", ",")} Sekunden. Ziel erreicht.` : `${sec.toFixed(1).replace(".", ",")} Sekunden. Noch ${Math.ceil(step.goal - sec)} bis zum Ziel.`),
        h("li", {}, sec < step.goal * 0.6 ? "Atme tiefer in den Bauch und die Flanken ein und lass die Luft sparsamer und gleichmässiger ausströmen." : "Achte darauf, dass das Zischen bis zum Schluss gleich laut bleibt.")),
        h("div", { class: "row" }, h("button", { class: "btn", onclick: () => next(sc) }, "Weiter"), h("button", { class: "btn ghost", onclick: () => { res.innerHTML = ""; show(0); } }, "Nochmal")));
      btn.textContent = "Start";
    };
    btn.onclick = async () => {
      if (running) { running = false; return; }
      const live = await Mic.ensure();
      running = true; btn.textContent = "Stopp"; res.innerHTML = "";
      const t0 = performance.now();
      if (live) {
        // automatisch messen: Start beim ersten Laut, Ende nach Stille
        const track = []; let started = null;
        const off = Engine.on(fr => {
          track.push(fr);
          if (started == null && fr.rms > 0.02) started = fr.t;
          if (started != null) show(fr.t - started);
          const recent = track.slice(-25);
          if (!running || (started != null && fr.t - started > 1 && recent.every(f => f.rms < 0.012))) { off(); done(analyzeHiss(track)); }
        });
        stepCleanup.push(off);
        btn.textContent = "Stopp";
      } else {
        // Stoppuhr: selbst stoppen
        const iv = setInterval(() => { const s = (performance.now() - t0) / 1000; show(s); if (!running) { clearInterval(iv); done(s); } }, 100);
        stepCleanup.push(() => clearInterval(iv));
      }
    };
    body.append(goal, out, h("p", { class: "muted small" }, Engine.live === false ? "Tippe auf Start, zische und tippe auf Stopp, wenn die Luft ausgeht." : "Tippe auf Start und zische los. Die Zeit stoppt automatisch, wenn du aufhörst."), h("div", { class: "row" }, btn, h("button", { class: "btn ghost", onclick: () => next(null) }, "Überspringen")), res);
  },

  sustain(step, body, next, prof) {
    const root = rootOf(prof);
    const target = root + parseNotes(step.note)[0].semi;
    exerciseWidget(body, {
      title: `Ton: ${nn(target)} auf «${step.syl}»`,
      targetsFor: t0 => [{ midi: target, t0, t1: t0 + step.secs, syl: step.syl }],
      listenDur: 1.6, playRef: t => Engine.tone(target, t, 1.4, 0.5),
      analyze: (targets, track) => analyzeSustain(target, track, { dyn: step.dyn, vib: step.vib }),
      next, kind: "sustain", step
    });
  },

  match(step, body, next, prof) {
    const root = rootOf(prof), r = rangeOf(prof);
    const notes = parseNotes(step.notes, step.syl);
    const beat = 60 / (step.bpm || 80);
    const keys = step.keys || [0];
    const maxS = Math.max(...notes.map(n => n.semi)), minS = Math.min(...notes.map(n => n.semi));
    const blocks = keys.map(k => clamp(root + k, r.low - minS, r.high - maxS));
    const patDur = notes.reduce((s, n) => s + n.beats * beat, 0);
    exerciseWidget(body, {
      title: `${notes.length} Töne${keys.length > 1 ? `, ${keys.length} Tonarten` : ""} · ab ${nn(blocks[0])}`,
      blocks, notes, beat, patDur,
      next, kind: "match", step
    });
  },

  glide(step, body, next) {
    exerciseWidget(body, { title: "Sirene", glide: true, secs: step.secs, analyze: (_, track) => analyzeGlide(track), next, kind: "glide", step });
  },

  range(step, body, next, prof) {
    rangeWidget(body, prof, () => next(null));
  }
};

const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

/* ---------- Atem-Widget ---------- */
function breathWidget(body, pattern, rounds, onDone) {
  const labels = ["Einatmen", "Halten", "Ausatmen", "Pause"];
  const circle = h("div", { class: "breath" }, h("div", { class: "breath-ball" }), h("div", { class: "breath-label" }, "Bereit?"), h("div", { class: "breath-sec" }, ""));
  const info = h("p", { class: "muted center" }, `${pattern[0]} Sek. ein${pattern[1] ? `, ${pattern[1]} halten` : ""}, ${pattern[2]} aus · ${rounds} Runden`);
  const btn = h("button", { class: "btn big" }, "Start");
  let tm = [];
  const stop = () => { tm.forEach(clearTimeout); tm = []; };
  stepCleanup.push(stop);
  btn.onclick = () => {
    stop(); btn.disabled = true;
    const ball = $(".breath-ball", circle), lab = $(".breath-label", circle), sec = $(".breath-sec", circle);
    let t = 0;
    for (let r = 0; r < rounds; r++) pattern.forEach((d, p) => {
      if (!d) return;
      tm.push(setTimeout(() => {
        lab.textContent = labels[p];
        ball.style.transitionDuration = d + "s";
        ball.style.transform = p === 0 ? "scale(1)" : p === 2 ? "scale(0.45)" : ball.style.transform;
        let left = d; sec.textContent = left;
        const iv = setInterval(() => { left--; sec.textContent = left > 0 ? left : ""; if (left <= 0) clearInterval(iv); }, 1000);
        tm.push(iv);
      }, t * 1000));
      t += d;
    });
    tm.push(setTimeout(() => { lab.textContent = "Fertig"; sec.textContent = ""; btn.disabled = false; btn.textContent = "Weiter"; btn.onclick = onDone; }, t * 1000));
  };
  body.append(circle, info, h("div", { class: "row center" }, btn, onDone ? h("button", { class: "btn ghost", onclick: onDone }, "Überspringen") : null));
}

/* ==========================================================================
   Übungs-Widget: Vorspielen, Singen (live oder Aufnahme), Auswertung
   ========================================================================== */
function exerciseWidget(body, cfg) {
  const canvas = h("canvas", { class: "roll", height: 220, "aria-label": "Tonhöhen-Anzeige" });
  const live = h("div", { class: "live-note" }, h("span", { class: "ln-note" }, "–"), h("span", { class: "ln-dev" }, ""));
  const fb = h("div", { class: "feedback", "aria-live": "polite" });
  const status = h("p", { class: "status" }, "");
  const btnRow = h("div", { class: "row" });
  body.append(h("p", { class: "ex-title" }, cfg.title), h("div", { class: "roll-wrap" }, canvas, live), status, btnRow, fb);

  // Ziel-Timeline
  let targets = [], listenSpans = [];
  function buildTimeline(t0, withListen) {
    targets = []; listenSpans = [];
    let t = t0;
    if (cfg.kind === "match") {
      for (const root of cfg.blocks) {
        if (withListen) { const ls = t; cfg.notes.forEach(n => { const d = n.beats * cfg.beat; listenSpans.push({ midi: root + n.semi, t0: t, t1: t + d * 0.92, syl: n.syl }); t += d; }); t += cfg.beat; void ls; }
        cfg.notes.forEach(n => { const d = n.beats * cfg.beat; targets.push({ midi: root + n.semi, t0: t, t1: t + d * 0.92, syl: n.syl }); t += d; });
        t += cfg.beat * 1.5;
      }
    } else if (cfg.kind === "sustain") {
      if (withListen) { listenSpans.push({ midi: cfg.targetsFor(t)[0].midi, t0: t, t1: t + 1.4 }); t += cfg.listenDur + 0.6; }
      targets = cfg.targetsFor(t);
    }
    return targets.length ? targets[targets.length - 1].t1 : t0 + (cfg.secs || 6);
  }
  buildTimeline(0, false);

  const ctx2 = canvas.getContext("2d");
  let track = [], viewT = 0, raf = 0, running = false, mode = "idle";
  function fitCanvas() { const w = canvas.clientWidth || 600; canvas.width = w * devicePixelRatio; canvas.height = 220 * devicePixelRatio; }
  fitCanvas();
  const ro = new ResizeObserver(() => { fitCanvas(); draw(); }); ro.observe(canvas);
  stepCleanup.push(() => { ro.disconnect(); cancelAnimationFrame(raf); running = false; });

  function yRange() {
    const ms = [...targets, ...listenSpans].map(x => x.midi);
    const vals = track.filter(f => f.midi != null).map(f => f.midi);
    if (cfg.glide) { const all = vals.length ? vals : [rootOf(profFor(S.mode === "kids" ? "kids" : "adult"))]; return [Math.min(...all) - 3, Math.max(...all) + 3]; }
    const lo = Math.min(...ms) - 4, hi = Math.max(...ms) + 4;
    return [lo, Math.max(hi, lo + 10)];
  }
  function draw(full) {
    const W = canvas.width, H = canvas.height, dpr = devicePixelRatio, cs = getComputedStyle(document.body);
    const col = n => cs.getPropertyValue(n).trim();
    ctx2.clearRect(0, 0, W, H);
    const [lo, hi] = yRange();
    let tA, tB;
    const end = Math.max(targets.length ? targets[targets.length - 1].t1 : 0, track.length ? track[track.length - 1].t : 0) + 0.5;
    const start0 = listenSpans.length ? listenSpans[0].t0 : targets.length ? targets[0].t0 : 0;
    if (full || mode !== "live") { tA = Math.min(start0, track[0]?.t ?? start0) - 0.3; tB = Math.max(end, tA + 4); }
    else { tA = viewT - 2; tB = viewT + 4.5; }
    const X = t => (t - tA) / (tB - tA) * W, Y = m => H - (m - lo) / (hi - lo) * H;
    // Notenlinien
    ctx2.font = `${11 * dpr}px "IBM Plex Mono", monospace`; ctx2.textBaseline = "middle";
    for (let m = Math.ceil(lo); m <= hi; m++) {
      const pc = ((m % 12) + 12) % 12, isC = pc === 0, white = [0, 2, 4, 5, 7, 9, 11].includes(pc);
      if (!white) continue;
      ctx2.strokeStyle = col(isC ? "--line-strong" : "--line"); ctx2.lineWidth = dpr * (isC ? 1 : 0.6);
      ctx2.beginPath(); ctx2.moveTo(0, Y(m)); ctx2.lineTo(W, Y(m)); ctx2.stroke();
      if (isC || pc === 7) { ctx2.fillStyle = col("--muted"); ctx2.fillText(nn(m), 4 * dpr, Y(m) - 7 * dpr); }
    }
    const bandH = (H / (hi - lo)) * 0.9;
    const rr = (x, y, w, hh, r) => { ctx2.beginPath(); ctx2.roundRect ? ctx2.roundRect(x, y, w, hh, r) : ctx2.rect(x, y, w, hh); };
    // Vorspiel-Noten (blass)
    listenSpans.forEach(s => { ctx2.fillStyle = col("--ghost"); rr(X(s.t0), Y(s.midi) - bandH / 2, Math.max(2, X(s.t1) - X(s.t0)), bandH, 6 * dpr); ctx2.fill(); });
    // Zielnoten
    const res = lastResult;
    const drawT = (tg, k) => {
      let fill = col("--target");
      if (res?.kind === "match" && res.notes[k]) fill = res.notes[k].score >= 0.6 ? col("--good-soft") : res.notes[k].found ? col("--warn-soft") : col("--bad-soft");
      let a = tg.t0, b = tg.t1;
      if (res?.kind === "match" && res.notes[k]?.seg) { a = res.notes[k].seg.t0; b = res.notes[k].seg.t1; }
      ctx2.fillStyle = fill; rr(X(a), Y(tg.midi) - bandH / 2, Math.max(3, X(b) - X(a)), bandH, 6 * dpr); ctx2.fill();
      if (tg.syl && X(b) - X(a) > 18 * dpr) { ctx2.fillStyle = col("--ink"); ctx2.fillText(tg.syl, X(a) + 5 * dpr, Y(tg.midi)); }
    };
    if (!(mode !== "live" && lastResult && !lastResult.live && cfg.kind === "match")) targets.forEach(drawT);
    else targets.forEach((tg, k) => { if (lastResult.notes[k]?.seg) drawT(tg, k); });
    // gesungene Linie
    ctx2.lineWidth = 3 * dpr; ctx2.lineCap = "round"; ctx2.lineJoin = "round";
    let prev = null;
    for (const f of track) {
      if (f.midi == null || f.t < tA || f.t > tB) { prev = null; continue; }
      if (prev && f.t - prev.t < 0.12) {
        const tg = targets.find(x => f.t >= x.t0 && f.t <= x.t1);
        const ok = tg ? Math.abs(foldCents((f.midi - tg.midi) * 100)) <= 50 : null;
        ctx2.strokeStyle = ok == null ? col("--voice") : ok ? col("--good") : col("--voice");
        ctx2.beginPath(); ctx2.moveTo(X(prev.t), Y(prev.midi)); ctx2.lineTo(X(f.t), Y(f.midi)); ctx2.stroke();
      }
      prev = f;
    }
    if (mode === "live" && !full) { ctx2.strokeStyle = col("--accent"); ctx2.lineWidth = 2 * dpr; ctx2.beginPath(); ctx2.moveTo(X(viewT), 0); ctx2.lineTo(X(viewT), H); ctx2.stroke(); }
  }

  let lastResult = null;
  function playListen(t0) {
    if (cfg.kind === "match") listenSpans.forEach(s => Engine.tone(s.midi, s.t0, s.t1 - s.t0, 0.5));
    if (cfg.kind === "sustain") cfg.playRef(listenSpans[0].t0);
    if (S.guide) targets.forEach(tg => Engine.tone(tg.midi, tg.t0, tg.t1 - tg.t0, 0.18));
    // Einzähler vor dem Singen
    if (targets.length) for (let k = 1; k <= 2; k++) Engine.click(targets[0].t0 - k * (cfg.beat || 0.5), k === 1);
  }
  function setLive(f) {
    const n = $(".ln-note", live), d = $(".ln-dev", live);
    if (f?.midi == null) { n.textContent = "–"; d.textContent = ""; live.dataset.state = ""; return; }
    n.textContent = nn(f.midi);
    const tg = targets.find(x => f.t >= x.t0 - 0.1 && f.t <= x.t1 + 0.1);
    if (tg) {
      const c = Math.round(foldCents((f.midi - tg.midi) * 100));
      d.textContent = Math.abs(c) <= 25 ? "genau" : c > 0 ? `${c} Cent zu hoch` : `${-c} Cent zu tief`;
      live.dataset.state = Math.abs(c) <= 50 ? "ok" : "off";
    } else { d.textContent = ""; live.dataset.state = ""; }
  }

  async function runLive() {
    const ok = await Mic.ensure();
    if (!ok) { setButtons(); return; }
    fb.innerHTML = ""; lastResult = null; track = []; mode = "live";
    const t0 = Engine.now() + 0.8;
    const endT = cfg.glide ? t0 + cfg.secs : buildTimeline(t0, true);
    if (cfg.glide) { targets = []; listenSpans = []; }
    playListen(t0);
    status.textContent = cfg.glide ? "Los geht's: gleite rauf und runter." : listenSpans.length ? "Hör zu …" : "Sing!";
    running = true; setButtons();
    const off = Engine.on(f => {
      if (!running) return;
      viewT = f.t;
      const firstT = targets[0]?.t0 ?? t0;
      if (f.t >= firstT - 0.3) track.push(f);
      if (!cfg.glide && listenSpans.length) status.textContent = f.t < firstT ? (f.t < firstT - (cfg.beat || 0.5) * 2 ? "Hör zu …" : "Gleich du …") : "Jetzt du!";
      setLive(f);
      if (f.t > endT + 0.4) finish();
    });
    stepCleanup.push(off);
    const loop = () => { if (!running) return; draw(); raf = requestAnimationFrame(loop); };
    loop();
    function finish() {
      if (!running) return;
      running = false; off(); cancelAnimationFrame(raf); mode = "done"; status.textContent = "";
      evaluate(true);
    }
    cancelBtn.onclick = finish;
  }

  async function runRecord() {
    fb.innerHTML = "";
    status.textContent = "Die Aufnahme-App öffnet sich. Singe die Übung und speichere die Aufnahme.";
    const file = await Mic.pickRecording();
    if (!file) { status.textContent = "Keine Aufnahme erhalten. Versuche es noch einmal."; return; }
    status.textContent = "Ich werte deine Aufnahme aus …";
    try {
      const r = await Engine.analyzeFile(file);
      buildTimeline(0, false);
      track = r.track; mode = "done";
      if (cfg.kind === "match") { // Ziele an Aufnahmezeit anpassen (nur für Anzeige)
        const off = (track.find(f => f.midi != null)?.t ?? 0) - (targets[0]?.t0 ?? 0);
        targets = targets.map(t => ({ ...t, t0: t.t0 + off, t1: t.t1 + off }));
      }
      if (cfg.kind === "sustain") { const v = track.filter(f => f.midi != null); if (v.length) targets = [{ ...targets[0], t0: v[0].t, t1: v[v.length - 1].t }]; }
      status.textContent = "";
      evaluate(false);
    } catch (e) { status.textContent = "Diese Aufnahme konnte ich nicht lesen. Bitte nimm sie im Format M4A, MP3 oder WAV auf."; }
  }

  function playOnly() {
    Engine.ensure();
    const t0 = Engine.now() + 0.2;
    if (cfg.kind === "match") { let t = t0; cfg.blocks.forEach(root => { cfg.notes.forEach(n => { const d = n.beats * cfg.beat; Engine.tone(root + n.semi, t, d * 0.92, 0.5); t += d; }); t += cfg.beat * 1.5; }); }
    if (cfg.kind === "sustain") Engine.tone(targets[0].midi, t0, 2.5, 0.5);
  }

  function evaluate(isLive) {
    let r;
    if (cfg.kind === "match") r = analyzeMatch(targets, track, isLive);
    else r = cfg.analyze(targets, track);
    r.live = isLive; lastResult = r;
    draw(true);
    renderFeedback(fb, r, cfg, () => { fb.innerHTML = ""; lastResult = null; track = []; draw(true); setButtons(); }, cfg.next);
    setButtons();
  }

  const cancelBtn = h("button", { class: "btn ghost" }, "Stopp");
  function setButtons() {
    btnRow.innerHTML = "";
    if (running) { btnRow.append(cancelBtn); return; }
    if (Engine.live !== false) {
      btnRow.append(h("button", { class: "btn big", onclick: runLive }, lastResult ? "Nochmal singen" : cfg.glide ? "Start" : "Anhören und singen"));
    } else {
      if (!cfg.glide) btnRow.append(h("button", { class: "btn", onclick: playOnly }, "Vorspielen"));
      btnRow.append(h("button", { class: "btn big", onclick: runRecord }, lastResult ? "Neu aufnehmen" : "Aufnehmen"));
      if (!lastResult) status.innerHTML = "";
      if (!lastResult) status.append(micNotice());
    }
    if (!lastResult) btnRow.append(h("button", { class: "btn ghost", onclick: () => cfg.next(null) }, "Überspringen"));
  }
  setButtons();
  draw(true);
}

function micNotice() {
  return h("span", { class: "notice" }, "Live-Mikrofon ist hier nicht erlaubt. Tippe auf «Vorspielen», dann auf «Aufnehmen» und singe die Übung in die Aufnahme-App deines Handys. Danach wertet die App alles aus.");
}

/* ---------- Rückmeldung ---------- */
function scoreRing(sc) {
  const r = 34, c = 2 * Math.PI * r;
  const svg = `<svg viewBox="0 0 80 80" width="80" height="80" aria-hidden="true"><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--line)" stroke-width="8"/><circle cx="40" cy="40" r="${r}" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - sc / 100)}" transform="rotate(-90 40 40)"/></svg>`;
  return h("div", { class: "ring" }, h("div", { html: svg }), h("strong", {}, String(sc)), h("span", {}, "Punkte"));
}
const cents = c => `${Math.abs(Math.round(c))} Cent`;

function tipsFor(r, kid) {
  const t = [];
  if (r.kind === "match") {
    if (r.foundFrac < 0.5) t.push(kid ? "Ich habe euch kaum gehört. Singt ruhig etwas lauter und näher am Handy!" : "Ich habe wenige Töne gehört. Sing etwas lauter, geh näher ans Gerät und sorg für eine ruhige Umgebung.");
    if (Math.abs(r.octave) >= 1) t.push(`Du singst eine Oktave ${r.octave < 0 ? "tiefer" : "höher"} als vorgespielt. Das ist in Ordnung und wird richtig gewertet.`);
    if (r.avgDev < -25) t.push(kid ? "Die Töne waren ein bisschen zu tief. Stellt euch vor, die Töne fliegen wie ein Vogel nach oben." : `Du singst im Schnitt ${cents(r.avgDev)} zu tief. Denk den Ton «von oben», hebe innerlich die Wangen wie beim Lächeln und gib etwas mehr Atemenergie.`);
    else if (r.avgDev > 25) t.push(kid ? "Die Töne waren ein bisschen zu hoch. Ganz locker bleiben!" : `Du singst im Schnitt ${cents(r.avgDev)} zu hoch. Meist steckt zu viel Druck dahinter: Kiefer und Nacken lockern, etwas leiser singen.`);
    if (!kid && r.highDev - r.lowDev < -35) t.push("Die hohen Töne geraten zu tief. Nicht hinaufdrücken, sondern leichter und mit mehr Kopfstimme hineingehen, der Vokal darf schmaler werden.");
    if (!kid && r.highDev - r.lowDev > 35) t.push("Die tiefen Töne sind zu tief, die hohen stimmen. Lass die tiefen Töne nicht «durchhängen», sondern singe sie mit der gleichen Spannung wie die hohen.");
    if (r.avgSd > 35) t.push(kid ? "Der Ton hat etwas gewackelt. Ganz ruhig Luft geben, wie beim langsamen Pusten." : "Die Töne schwanken. Lass die Luft gleichmässig fliessen und halte die Flanken weit, so wird jeder Ton ruhiger.");
    const missed = r.notes.filter(n => !n.found).length;
    if (missed && r.foundFrac >= 0.5) t.push(`${missed} ${missed === 1 ? "Ton fehlte" : "Töne fehlten"}. Setz jeden Ton bewusst neu an, auch wenn er gleich bleibt.`);
    if (r.score >= 85) t.unshift(kid ? "Wow, super gesungen!" : "Sehr sauber gesungen. Du kannst das Tempo oder die Tonart steigern.");
    else if (!t.length) t.push("Gut gemacht. Wiederhole die Übung und achte auf die orange markierten Töne.");
  }
  if (r.kind === "sustain") {
    if (r.n < 10) t.push("Ich habe kaum einen gehaltenen Ton gehört. Sing den Ton etwas lauter und länger.");
    else {
      if (r.med < -25) t.push(`Der Ton liegt ${cents(r.med)} zu tief. Mehr Spannung im Körper, Blick nach vorne oben, Ton von oben ansetzen.`);
      else if (r.med > 25) t.push(`Der Ton liegt ${cents(r.med)} zu hoch. Entspanne Kiefer und Zunge und nimm etwas Druck weg.`);
      if (r.drift < -30) t.push(`Der Ton sinkt zum Ende um ${cents(r.drift)} ab. Teile die Luft besser ein und halte die Stütze bis zum Schluss.`);
      if (r.drift > 30) t.push(`Der Ton steigt zum Ende um ${cents(r.drift)}. Achte darauf, am Schluss nicht mehr zu drücken.`);
      if (r.sd > 30 && !r.vibRate) t.push("Der Ton wackelt. Gleichmässig ausatmen und den Ton wie einen geraden Faden halten.");
      if (r.dynRange != null) t.push(r.dynRange < 6 ? "Die Lautstärke hat sich kaum verändert. Trau dich, in der Mitte deutlich lauter zu werden." : r.peakPos < 0.25 || r.peakPos > 0.75 ? "Der lauteste Moment war am Rand. Plane den Höhepunkt in der Mitte des Tons." : `Schönes An- und Abschwellen mit ${Math.round(r.dynRange)} dB Unterschied.`);
      if (r.vibRate) t.push(r.vibRate >= 4.5 && r.vibRate <= 7.5 && r.vibExtent > 30 ? `Vibrato erkannt: ${r.vibRate.toFixed(1).replace(".", ",")} Schwingungen pro Sekunde. Das ist ein gesundes Tempo.` : r.vibExtent <= 30 ? "Noch kaum Vibrato. Bleib locker, es kommt mit der Zeit von selbst." : `Vibrato mit ${r.vibRate.toFixed(1).replace(".", ",")} pro Sekunde. ${r.vibRate > 7.5 ? "Etwas schnell, das deutet auf Spannung hin." : "Etwas langsam, gib mehr Atemfluss."}`);
      if (r.score >= 85) t.unshift("Ruhig und sauber gehalten. Sehr gut!");
      if (!t.length) t.push("Guter Ton. Versuche ihn beim nächsten Mal noch etwas länger zu halten.");
    }
  }
  if (r.kind === "glide") {
    if (r.empty) t.push("Ich habe nichts gehört. Sing etwas lauter oder geh näher ans Gerät.");
    else {
      t.push(`Deine Sirene reichte von ${nn(r.lo)} bis ${nn(r.hi)}, das sind ${Math.round(r.range)} Halbtöne.`);
      if (r.jumps.length) t.push(`Bei ${nn(median(r.jumps))} ist die Stimme gesprungen. An dieser Stelle leiser werden und ganz weich weitergleiten.`);
      if (r.gaps > 1) t.push("Der Ton ist mehrmals abgerissen. Halte den Luftstrom gleichmässig, auch wenn es hoch wird.");
      if (r.range < 10) t.push(kid ? "Probiert, noch höher und noch tiefer zu kommen!" : "Wage dich noch etwas weiter nach oben, ganz leicht und leise.");
    }
  }
  return t;
}

function summaryLine(r) {
