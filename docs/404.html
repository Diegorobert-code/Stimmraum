<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Weiterleitung</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07091A;color:#E9ECF5;font:500 16px/1.5 system-ui,sans-serif}a{color:#FFB547}</style>
<script>
// Falsche oder alte Adressen landen nicht mehr auf einer 404-Seite:
// alles, was nach Sense Engine aussieht, geht zur Sense Engine, der Rest zum Stimmraum.
(function () {
  var base = "/Stimmraum/";
  var p = location.pathname.toLowerCase();
  var ziel = /sense|nova|engine/.test(p) ? base + "sense/" : base;
  location.replace(ziel + location.search + location.hash);
})();
</script>
</head>
<body><p>Einen Moment … <a href="/Stimmraum/sense/">Zur Sense Engine</a></p></body>
</html>
